async function loadXmlFile(f){
 if(!f)return;
 if(extOf(f.name)!=='xml'){toast('Pilih file berekstensi .xml.','error');return}
 if(!f.size){toast('File kosong (0 byte).','error');return}
 if(f.size>MAX_XML_BYTES){toast(`File terlalu besar (${fmtSize(f.size)}). Maks. ${fmtSize(MAX_XML_BYTES)}.`,'error');return}
 if(!await confirmReplaceXml())return;
 let t;try{t=await f.text()}catch(e){toast('Gagal membaca file: '+(e&&e.message||e),'error');return}
 if(t.length>MAX_XML_CHARS){toast('Isi file melebihi batas karakter.','error');return}
 setXmlText(t,{name:f.name.replace(/\.xml$/i,'')});toast(`File "${f.name}" dimuat ke editor (${fmtSize(f.size)}). Belum disimpan ke library.`,'success')}
async function saveXmlPreset(){
 const X=PASTE.xml;if(!X.text.trim()){toast('Tempel XML terlebih dahulu.','warn');return}
 const r=validateXml(true);if(!r){toast('XML tidak valid — tidak dapat disimpan sebagai preset. Perbaiki dulu isinya.','error');return}
 const info=X.info,name=(X.name.trim()||info.meta.name||info.meta.title||'XML Tempelan').slice(0,80);
 const id=uid(),blob=new Blob([X.text],{type:'application/xml'});
 try{await DB.put(id+':main',blob)}catch(e){toast(isQuota(e)?'Penyimpanan penuh. Hapus beberapa file lalu coba lagi.':'Gagal menyimpan XML: '+(e&&e.message||e),'error');return}
 const p=sanitizePreset({id,name,creator:X.creator.trim()||null,category:X.cat,description:X.desc,tags:parseTags(X.tags),ext:'xml',fileName:safeName(name)+'.xml',size:blob.size,added:Date.now(),kind:'xml',hasMain:true});
 if(!p){await DB.del(id+':main').catch(()=>{});toast('Data preset tidak valid.','error');return}
 S.presets.unshift(p);if(!savePresets()){S.presets.shift();await DB.del(id+':main').catch(()=>{});return}
 X.savedId=id;renderXmlSide();updateNav();
 toast(DB.ok?`XML disimpan ke library (${fmtSize(blob.size)}).`:'XML disimpan, tetapi penyimpanan permanen tidak tersedia — hanya bertahan selama tab terbuka.',DB.ok?'success':'warn')}

 if(dup&&!await confirmBox('Link sudah tersimpan',`Link ini sudah ada di library sebagai "${dup.name}". Simpan sebagai item baru?`,'Simpan lagi'))return;

async function importMetaFile(f){
 if(!f)return;if(f.size>10*1024*1024){toast('File JSON terlalu besar (maks. 10 MB).','error');return}
 let d;try{d=JSON.parse(await f.text())}catch{toast('File bukan JSON yang valid.','error');return}
 const arr=d&&Array.isArray(d.presets)?d.presets:null;if(!arr||arr.length>5000){toast('Format tidak dikenali: properti "presets" tidak ditemukan atau terlalu banyak.','error');return}
 let add=0,skip=0,bad=0;const have=new Set(S.presets.map(p=>p.id));
 for(const o of arr){const p=sanitizePreset(o);if(!p){bad++;continue}if(have.has(p.id)){skip++;continue}

  S.presets.push(p);have.add(p.id);add++}
 savePresets();updateNav();toast(`Impor selesai: ${add} ditambahkan, ${skip} sudah ada, ${bad} tidak valid. Pengaturan tidak diubah; file tidak ikut diimpor.`,add?'success':'warn');if(S.route.name==='settings'||S.route.name==='library')render()}

VIEWS.about=()=>`<section class="page"><div class="page-h"><div><h1>About</h1><p class="muted">Discover • Preview • Organize • Create</p></div></div>
 <div class="two"><div class="card pad" style="display:flex;flex-direction:column;gap:10px"><h2>ALIGHT MOTION PRESET PLAYER PRO</h2><p>Aplikasi web satu file untuk menyimpan, memberi label, dan mempratinjau koleksi preset Alight Motion langsung di browser. Semua data tersimpan lokal di perangkatmu.</p>
  <h3>Batasan yang perlu diketahui</h3><ul class="steps"><li>Aplikasi ini <b>tidak</b> merender proyek/preset native Alight Motion. Untuk file XML/ZIP/proyek, yang diputar adalah video atau gambar preview yang kamu sertakan.</li><li>Data tersimpan di browser dan dapat terhapus jika data situs dibersihkan. Ekspor metadata bukan backup file lengkap.</li><li>Berbagi link preset, sinkronisasi antar perangkat, akun, dan katalog online memerlukan backend — belum tersedia di versi ini.</li><li>Pemindai QR via kamera butuh HTTPS/localhost; tanpa BarcodeDetector bawaan browser, library jsQR dimuat dari internet.</li><li>MOV/HEVC tergantung dukungan codec browser.</li><li><b>Tempel Preset:</b> link berbagi Alight Motion hanya disimpan dan dibuka di tab baru — impor dilakukan di halaman resmi/aplikasi Alight Motion, bukan oleh aplikasi ini. Judul halaman hanya bisa dibaca jika situs tujuan mengizinkan akses dari browser (CORS); jika tidak, judul ditandai belum dapat dibaca.</li><li>XML yang ditempel hanya diperiksa sintaksnya (DOMParser) dan tidak pernah dijalankan. XML yang valid tidak otomatis berarti preset Alight Motion yang siap diimpor.</li><li>Selain pemindai QR (opsional), aplikasi berjalan offline setelah dimuat.</li></ul></div>
 <div class="card pad"><h2>Pintasan keyboard</h2><div class="klist" style="margin-top:12px">${shortcutsHTML()}</div><h3 style="margin-top:18px">Privasi</h3><p class="muted sm">File dan metadata tidak dikirim ke server. Tidak ada API key di kode. Nama file, deskripsi, dan data impor diperlakukan sebagai data tidak tepercaya, dan isi file tidak pernah dijalankan.</p></div></div></section>`;
const shortcutsHTML=()=>[['Space','Putar / jeda preview'],['F','Layar penuh'],['←  /  →','Mundur / maju 5 detik'],['M','Bisukan / suarakan'],['Esc','Tutup dialog / keluar layar penuh'],['?','Tampilkan bantuan ini']].map(([k,t])=>`<div><span>${t}</span><span class="kbd">${k}</span></div>`).join('');

/* ============ actions ============ */
const A={
 go:el=>go(el.dataset.go),
 /* tempel preset */
 'paste-tab':el=>{PASTE.tab=el.dataset.v==='xml'?'xml':'link';render()},

 'lk-check':()=>checkLink(),
 'lk-open':()=>{const c=classifyLink(PASTE.link.text);if(c.state==='empty'){toast('Tempel tautan terlebih dahulu.','warn');return}return openLinkSafe(PASTE.link.text)},
 'lk-copy':async()=>{const t=PASTE.link.text.trim();if(!t){toast('Tidak ada tautan untuk disalin.','warn');return}const ok=await copyText(t);toast(ok?'Link disalin.':'Tidak dapat menyalin. Salin manual dari kolom.',ok?'success':'error')},
 'lk-save':()=>saveLinkPreset(),
 'lk-detail':()=>{if(PASTE.link.savedId)go('detail/'+PASTE.link.savedId)},
 'lk-clear':async()=>{const L=PASTE.link,has=L.text.trim()||L.name||L.desc||L.tags;const saved=L.savedId&&byId(L.savedId);if(has&&!saved&&!await confirmBox('Bersihkan form?','Tautan dan isian yang belum disimpan akan dihapus.','Bersihkan',true))return;Object.assign(L,{text:'',tstate:'idle',title:null,treason:'',tok:null,name:'',cat:'Custom Preset',desc:'',tags:'',savedId:null});render()},
 'lk-toxml':()=>{const X=PASTE.xml;X.text=PASTE.link.text;X.vstate='idle';X.info=null;X.err='';X.savedId=null;PASTE.link.text='';PASTE.link.tstate='idle';PASTE.tab='xml';render()},
 'xm-tolink':()=>{const L=PASTE.link;L.text=PASTE.xml.text.trim();L.tstate='idle';L.title=null;L.savedId=null;PASTE.xml.text='';PASTE.xml.vstate='idle';PASTE.xml.info=null;PASTE.tab='link';render()},
 'xm-clip':async()=>{const t=await readClip();if(t==null)return;if(t.length>MAX_XML_CHARS){toast('Isi clipboard melebihi batas karakter.','error');return}if(!await confirmReplaceXml())return;setXmlText(t);toast('Teks ditempel dari clipboard.','success')},
 'xm-file':()=>{$('#f-xml').value='';$('#f-xml').click()},
 'xm-pick':()=>{const items=S.presets.filter(p=>p.hasMain&&p.ext==='xml');if(!items.length){toast('Belum ada file XML tersimpan di library.','info');return}
  openModal({title:'Pilih XML tersimpan',body:`<p class="muted sm" style="margin-bottom:10px">Isi dimuat ke editor. Item asli tidak diubah; menyimpan akan membuat item baru.</p><div class="plist">${items.map(p=>`<button class="btn" style="justify-content:space-between;width:100%" data-act="xm-load" data-id="${p.id}"><span style="overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</span><span class="muted xs">${fmtSize(p.size)}</span></button>`).join('')}</div>`})},
 'xm-load':async el=>{const p=byId(el.dataset.id);if(!p)return;let b=null;try{b=await DB.get(p.id+':main')}catch{}
  if(!b){toast('File tidak ditemukan di penyimpanan browser.','error');return}
  if(b.size>MAX_XML_BYTES){toast('File terlalu besar untuk editor (maks. '+fmtSize(MAX_XML_BYTES)+').','error');return}
  if(!await confirmReplaceXml())return;const t=await b.text();closeAllModals();setXmlText(t);toast(`"${p.name}" dimuat ke editor.`,'success')},
 'xm-validate':()=>{validateXml(false)},
 'xm-view':()=>{const X=PASTE.xml;if(!X.text.trim()){toast('Tempel XML terlebih dahulu.','warn');return}const r=validateXml(true);if(!r){toast('XML tidak valid — lihat pesan di panel hasil.','error');return}viewXmlInfo(X.info,'Isi XML (ringkasan)')},
 'xm-copy':async()=>{const t=PASTE.xml.text;if(!t.trim()){toast('Tidak ada XML untuk disalin.','warn');return}const ok=await copyText(t);toast(ok?'XML disalin.':'Tidak dapat menyalin. Salin manual dari kolom.',ok?'success':'error')},
 'xm-download':()=>pasteDownloadXml(),
 'xm-save':()=>saveXmlPreset(),
 'xm-detail':()=>{if(PASTE.xml.savedId)go('detail/'+PASTE.xml.savedId)},
 'xm-clear':async()=>{const X=PASTE.xml;if(!X.text.trim()){toast('Editor sudah kosong.','info');return}if(xmlUnsaved()&&!await confirmBox('Kosongkan XML?','Isi XML yang belum disimpan akan hilang.','Kosongkan',true))return;X.text='';X.vstate='idle';X.info=null;X.err='';X.savedId=null;render()},
 'xm-clearall':async()=>{const X=PASTE.xml,has=X.text.trim()||X.name||X.desc||X.tags||X.creator;if(has&&!(X.savedId&&byId(X.savedId))&&!await confirmBox('Bersihkan form?','XML dan isian metadata yang belum disimpan akan dihapus.','Bersihkan',true))return;Object.assign(X,{text:'',vstate:'idle',err:'',line:null,col:null,info:null,name:'',cat:'XML Preset',creator:'',desc:'',tags:'',savedId:null});render()},
 'xml-view':async el=>{const p=byId(el.dataset.id);if(!p)return;let b=null;try{b=await DB.get(p.id+':main')}catch{}if(!b){toast('File tidak ditemukan di penyimpanan browser.','error');return}if(b.size>MAX_XML_BYTES){toast('File terlalu besar untuk ditampilkan.','error');return}viewXmlText(await b.text(),'Isi XML: '+p.name)},
 'copy-src':async el=>{const p=byId(el.dataset.id);if(!p||!p.sourceUrl)return;const ok=await copyText(p.sourceUrl);toast(ok?'Link sumber disalin.':'Tidak dapat menyalin link sumber.',ok?'success':'error')},
 back:()=>{if(S.depth>0){S.depth--;history.back()}else go('library')},
 detail:el=>go('detail/'+el.dataset.id),
 play:el=>{const p=byId(el.dataset.id);if(p&&!previewKey(p))toast(`Preview "${p.name}" belum tersedia — halaman player menampilkan keterangannya.`,'info');openPlayer(el.dataset.id)},
 fav:el=>{const p=byId(el.dataset.id);if(!p)return;p.fav=!p.fav;if(savePresets())toast(p.fav?`"${p.name}" ditambahkan ke favorit.`:`"${p.name}" dihapus dari favorit.`,'success');updateNav();refresh()},
 qadd:el=>{const p=byId(el.dataset.id);if(!p)return;if(S.queue.includes(p.id)){toast(`"${p.name}" sudah ada di antrean.`,'info');return}S.queue.push(p.id);saveLists();updateNav();toast(`"${p.name}" ditambahkan ke antrean (${S.queue.length}).`,'success');if(S.route.name==='player')render()},
 qrem:el=>{S.queue=S.queue.filter(i=>i!==el.dataset.id);saveLists();updateNav();toast('Dihapus dari antrean.','success');render()},
 qup:el=>{const i=+el.dataset.i;if(i>0){[S.queue[i-1],S.queue[i]]=[S.queue[i],S.queue[i-1]];saveLists();render()}},
 qdn:el=>{const i=+el.dataset.i;if(i<S.queue.length-1){[S.queue[i+1],S.queue[i]]=[S.queue[i],S.queue[i+1]];saveLists();render()}},
 qplay:el=>{const p=byId(el.dataset.id);if(p&&!previewKey(p))toast(`Preview "${p.name}" belum tersedia.`,'warn');openPlayer(el.dataset.id)},
 qstart:()=>{const p=byId(S.queue[0]);if(!p)return;if(!previewKey(p))toast(`Preview "${p.name}" belum tersedia.`,'warn');openPlayer(p.id)},
 qrepeat:()=>{S.settings.repeatQueue=!S.settings.repeatQueue;saveSettings();toast(S.settings.repeatQueue?'Ulangi antrean aktif.':'Ulangi antrean nonaktif.','info');render()},
 qclear:async()=>{if(await confirmBox('Hapus semua antrean?',`${S.queue.length} preset akan dikeluarkan dari antrean (preset tidak dihapus).`,'Hapus antrean',true)){S.queue=[];saveLists();updateNav();toast('Antrean dikosongkan.','success');render()}},
 edit:el=>{const p=byId(el.dataset.id);if(p)editPreset(p)},
 del:el=>{const p=byId(el.dataset.id);if(p)deletePreset(p)},
 dl:el=>{const p=byId(el.dataset.id);if(p)downloadPreset(p)},
 share:async el=>{const p=byId(el.dataset.id);if(!p)return;const data={title:p.name,text:`Preset ${p.category}: ${p.name}`,url:presetLink(p)};if(navigator.share){try{await navigator.share(data);toast('Dibagikan.','success')}catch(e){if(e&&e.name!=='AbortError')toast('Gagal membagikan: '+e.message,'error')}}else A.copy(el)},
 copy:async el=>{const p=byId(el.dataset.id);if(!p)return;const ok=await copyText(presetLink(p));toast(ok?'Link disalin (hanya berfungsi di browser/perangkat ini).':'Tidak dapat menyalin link. Salin manual dari bilah alamat.',ok?'success':'error')},
 cat:el=>{S.lib={...S.lib,cat:el.dataset.cat,page:1,q:''};$('#gsearch').value='';syncSearch();go('library')},
 'search-clear':()=>{S.lib.q='';const i=$('#gsearch');i.value='';syncSearch();i.focus();if(S.route.name==='library')renderLibResults()},
 'lib-fav':()=>{S.lib.fav=!S.lib.fav;S.lib.page=1;render()},
 'lib-view':el=>{S.lib.view=el.dataset.v;render()},
 'lib-reset':()=>{S.lib={...S.lib,q:'',cat:'all',fmt:'all',sort:'new',page:1,fav:false};$('#gsearch').value='';syncSearch();if(S.route.name==='library')render();else go('library')},
 'lib-more':()=>{S.lib.page++;renderLibResults()},
 theme:()=>{S.settings.theme=S.settings.theme==='dark'?'light':'dark';saveSettings();applySettings();updateNav();if(S.route.name==='settings')render()},
 collapse:()=>{S.settings.collapsed=!S.settings.collapsed;saveSettings();applySettings()},
 more:()=>{const items=NAV.filter(([k])=>!BOTTOM.includes(k));openModal({title:'Menu',sheet:true,body:`<div class="more-grid">${items.map(([k,i])=>`<button data-act="go" data-go="${k}">${ic(i,24)}<span>${ROUTES[k]}</span></button>`).join('')}<button data-act="theme">${ic(S.settings.theme==='dark'?'sun':'moon',24)}<span>Tema</span></button><button data-act="help">${ic('keyboard',24)}<span>Pintasan</span></button></div>`})},
 help:()=>openModal({title:'Pintasan keyboard',body:`<div class="klist">${shortcutsHTML()}</div><p class="muted xs" style="margin-top:12px">Pintasan tidak aktif saat mengetik di kolom teks.</p>`}),
 'fav-clear':async()=>{if(await confirmBox('Hapus semua favorit?','Tanda favorit pada semua preset akan dihapus (preset tidak dihapus).','Hapus favorit',true)){S.presets.forEach(p=>p.fav=false);savePresets();updateNav();toast('Semua favorit dihapus.','success');render()}},
 'opened-clear':async()=>{if(await confirmBox('Hapus riwayat dibuka?','Riwayat preset yang dibuka akan dikosongkan.','Hapus',true)){S.opened=[];saveLists();toast('Riwayat dibuka dihapus.','success');render()}},
 'played-clear':async()=>{if(await confirmBox('Hapus riwayat preview?','Riwayat preview yang diputar akan dikosongkan.','Hapus',true)){S.played=[];saveLists();toast('Riwayat preview dihapus.','success');render()}},
 /* player */
 'pl-toggle':()=>togglePlay(),'pl-back5':()=>seekBy(-5),'pl-fwd5':()=>seekBy(5),'pl-prev':()=>stepPreset(-1),'pl-next':()=>stepPreset(1),'pl-fs':()=>toggleFS(),
 'pl-loop':el=>{S.player.loop=!S.player.loop;if(S.player.v)S.player.v.loop=S.player.loop;el.classList.toggle('on',S.player.loop);toast(S.player.loop?'Ulangi video aktif.':'Ulangi video nonaktif.','info')},
 'pl-mute':()=>{const v=S.player.v;if(v)v.muted=!v.muted},
 'pl-retry':()=>{const p=byId(S.player.id||S.activeId);if(p){stopPlayer();render()}},
 /* import */
 'imp-pick':e=>{$('#f-import').click()},
 'imp-remove':el=>{const s=stById(el.dataset.sid);if(s){freeStaged(s);S.staged=S.staged.filter(x=>x!==s);rerenderStaged()}},
 'imp-clear':()=>{S.staged.forEach(freeStaged);S.staged=[];rerenderStaged();toast('Daftar impor dibatalkan.','info')},
 'imp-prevpick':el=>{S.prevFor=el.dataset.sid;$('#f-prev').value='';$('#f-prev').click()},
 'imp-prevclear':el=>{const s=stById(el.dataset.sid);if(s){s.prev=null;rerenderStaged()}},
 'imp-save':()=>saveStaged(),
 /* qr */
 'qr-start':()=>startScan(),'qr-stop':()=>{stopScan();const b=$('#qr-box');if(b)b.innerHTML='<div class="muted sm" style="padding:20px;text-align:center">Kamera dihentikan</div>'},
 'qr-pick':()=>{$('#f-qr').value='';$('#f-qr').click()},
 'qr-copy':async()=>{const ok=await copyText(S.qr.result||'');toast(ok?'Teks disalin.':'Tidak dapat menyalin.',ok?'success':'error')},
 'qr-open':async()=>{const a=assessUrl(S.qr.result||'');if(a.kind!=='url')return;const msg=a.warnings.length?'Tautan ini memiliki peringatan:\n• '+a.warnings.join('\n• ')+'\nTetap buka?':`Buka ${a.host} di tab baru?`;if(await confirmBox('Buka tautan?',msg,'Buka',a.warnings.length>0)){window.open(a.url,'_blank','noopener,noreferrer');toast('Tautan dibuka di tab baru.','info')}},
 'qr-save':()=>saveQRPreset(),'qr-clear':()=>{S.qr.result=null;const e=$('#qr-res');if(e)e.innerHTML=''},
 'qr-check':()=>{const v=($('#qr-manual').value||'').trim();if(!v){toast('Masukkan tautan terlebih dahulu.','warn');return}setQR(v)},
 /* files */
 'fm-check':async el=>{const p=byId(el.dataset.id);if(p){const s=await checkFile(p);savePresets();if(s.c==='ok')toast(`"${p.name}" tersedia.`,'success')}},
 'fm-checkall':async()=>{let bad=0;for(const p of S.presets){const s=await checkFile(p,true);if(s.c==='bad')bad++}savePresets();toast(bad?`${bad} file tidak ditemukan.`:'Pemeriksaan selesai: semua file tercatat tersedia.',bad?'warn':'success')},
 'fm-rename':el=>{const p=byId(el.dataset.id);if(!p)return;openModal({title:'Ubah nama tampilan',body:`<label class="fld"><span>Nama tampilan</span><input class="input" id="rn" maxlength="80" value="${esc(p.name)}"></label><p class="err" id="rn-e"></p><p class="muted xs">Nama file asli tidak berubah.</p>`,actions:[{label:'Batal'},{label:'Simpan',cls:'primary',run:w=>{const v=$('#rn',w).value.trim();if(!v){$('#rn-e',w).textContent='Nama tidak boleh kosong.';return false}p.name=v.slice(0,80);savePresets();toast('Nama tampilan disimpan.','success');render()}}]})},
 /* settings */
 'set-theme':el=>{S.settings.theme=el.dataset.v;saveSettings();applySettings();updateNav();render()},
 'set-accent':el=>{S.settings.accent=el.dataset.v;saveSettings();applySettings();render()},
 'set-grid':el=>{S.settings.grid=el.dataset.v;saveSettings();applySettings();render()},
 'set-export':()=>exportMeta(),'set-importjson':()=>{$('#f-json').value='';$('#f-json').click()},
 'set-persist':async()=>{if(!navigator.storage||!navigator.storage.persist){toast('Browser tidak mendukung penyimpanan permanen.','warn');return}try{const ok=await navigator.storage.persist();toast(ok?'Penyimpanan permanen diberikan.':'Browser tidak memberikan penyimpanan permanen.',ok?'success':'warn')}catch(e){toast('Gagal meminta penyimpanan permanen.','error')}},
 'set-demo':()=>{const have=new Set(S.presets.filter(p=>p.demo).map(p=>p.name));const add=seedDemo().filter(p=>!have.has(p.name));S.presets.push(...add);savePresets();updateNav();toast(add.length?`${add.length} data demo dimuat.`:'Semua data demo sudah ada.',add.length?'success':'info');render()},
 'set-reset':async()=>{if(await confirmBox('Reset pengaturan?','Semua pengaturan kembali ke bawaan. Preset tidak dihapus.','Reset',true)){S.settings={...DEFAULTS};saveSettings();applySettings();updateNav();toast('Pengaturan direset.','success');render()}},
 'set-clear':async()=>{if(!await confirmBox('Hapus seluruh data?','Semua preset, file, favorit, riwayat, antrean, dan pengaturan di browser ini akan dihapus permanen. Ekspor metadata dulu jika perlu. Tindakan ini tidak dapat dibatalkan.','Hapus semuanya',true))return;
  try{await DB.clear();for(const k of[...URLS.keys()])dropURL(k);['presets','settings','opened','played','queue'].forEach(LS.del);LS.set('seeded',true);toast('Seluruh data dihapus. Memuat ulang…','success');setTimeout(()=>{location.hash='#/home';location.reload()},900)}catch(e){toast('Gagal menghapus data: '+(e&&e.message||e),'error')}}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;if(el.disabled)return;const fn=A[el.dataset.act];if(!fn)return;if(el.tagName==='A')e.preventDefault();
 if(el.closest('.modal-wrap')&&['go','theme','help'].includes(el.dataset.act)&&el.closest('.more-grid')){const m=modalStack[modalStack.length-1];m&&m.close()}
 try{const r=fn(el,e);if(r&&r.catch)r.catch(err=>{console.error(err);toast('Terjadi kesalahan: '+(err&&err.message||err),'error')})}catch(err){console.error(err);toast('Terjadi kesalahan: '+(err&&err.message||err),'error')}});

/* ============ input handlers ============ */
const updXmCount=()=>{const e=$('#xm-count');if(e)e.innerHTML=xmCountHTML()};
const IN={
 'lk-text':el=>{const L=PASTE.link;L.text=el.value;L.tstate='idle';L.title=null;L.treason='';L.tok=null;if(L.savedId){const s=byId(L.savedId);if(!s||s.sourceUrl!==classifyLink(L.text).raw)L.savedId=null}renderLinkRes();const h=$('#lk-hint');if(h)h.innerHTML=lkHint()},
 plf:el=>{if(['name','cat','desc','tags'].includes(el.dataset.f))PASTE.link[el.dataset.f]=el.value},
 'xm-text':el=>{const X=PASTE.xml,prevLen=X.text.length,was=X.vstate+'|'+(X.savedId||'');X.text=el.value;X.vstate='idle';X.info=null;X.err='';X.savedId=null;updXmCount();const h=$('#xm-hint');if(h)h.innerHTML=xmHint();if(was!=='idle|'||(!prevLen)!==(!X.text.length))renderXmlSide()},
 pxf:el=>{if(['name','cat','creator','desc','tags'].includes(el.dataset.f))PASTE.xml[el.dataset.f]=el.value},
 'px-file':el=>{const f=el.files[0];el.value='';loadXmlFile(f)},
 'lib-cat':el=>{S.lib.cat=el.value;S.lib.page=1;renderLibResults()},'lib-fmt':el=>{S.lib.fmt=el.value;S.lib.page=1;renderLibResults()},'lib-sort':el=>{S.lib.sort=el.value;S.lib.page=1;renderLibResults()},
 'fm-type':el=>{S.files.type=el.value;render()},'fm-sort':el=>{S.files.sort=el.value;render()},
 'pl-seek':el=>{const v=S.player.v;if(v&&isFinite(v.duration))v.currentTime=el.value/1000*v.duration},
 'pl-vol':el=>{const v=S.player.v,x=el.value/100;if(v){v.volume=x;v.muted=x===0}},
 'pl-speed':el=>{const v=S.player.v,x=+el.value;if(v)v.playbackRate=x;S.settings.speed=x;saveSettings()},
 set:el=>{const k=el.dataset.key,t=el.dataset.type;let v;if(t==='bool')v=el.checked;else if(t==='vol')v=el.value/100;else v=+el.value;S.settings[k]=v;saveSettings();applySettings();if(k==='repeatQueue')updateNav()},
 stg:el=>{const s=stById(el.dataset.sid);if(s)s[el.dataset.f]=el.value},
 'imp-files':el=>{const f=[...el.files];el.value='';if(S.route.name!=='import')go('import');if(f.length)addStaged(f)},
 'imp-prevfile':el=>{const f=el.files[0],s=stById(S.prevFor);el.value='';if(!f||!s)return;const e=extOf(f.name);if(!['video','image','audio'].includes(groupOf(e))){toast('File preview harus video, gambar, atau audio yang didukung.','error');return}if(f.size>MAX_FILE){toast('File preview terlalu besar (maks. 300 MB).','error');return}s.prev=f;rerenderStaged();toast('File preview ditambahkan.','success');
  mediaMeta(f,groupOf(e)).then(m=>{if(m&&m.thumb&&!s.thumb&&S.staged.includes(s)){s.thumb=m.thumb;s.thumbUrl=URL.createObjectURL(m.thumb);rerenderStaged()}})},
 'set-json':el=>{const f=el.files[0];el.value='';importMetaFile(f)},
 'qr-file':el=>{const f=el.files[0];el.value='';scanImageFile(f)}};
document.addEventListener('input',e=>{const el=e.target.closest&&e.target.closest('[data-in]');if(el&&el.type!=='file'&&IN[el.dataset.in])IN[el.dataset.in](el,e)});
document.addEventListener('change',e=>{const el=e.target.closest&&e.target.closest('[data-in]');if(el&&el.type==='file'&&IN[el.dataset.in])IN[el.dataset.in](el,e)});
function syncSearch(){$('#searchbox').classList.toggle('has',!!$('#gsearch').value)}
$('#gsearch').addEventListener('input',e=>{S.lib.q=e.target.value;S.lib.page=1;syncSearch();if(S.route.name==='library')renderLibResults();else go('library')});
['dragover','drop'].forEach(ev=>window.addEventListener(ev,e=>{if(e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files')){e.preventDefault();if(ev==='drop'&&!e.target.closest('#dropzone')){go('import');const f=[...e.dataTransfer.files];if(f.length)setTimeout(()=>addStaged(f),50)}}}));
window.addEventListener('hashchange',onRoute);

/* ============ keyboard ============ */
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(modalStack.length){modalStack[modalStack.length-1].close();e.preventDefault()}return}
 const t=e.target,typing=t.matches&&t.matches('input:not([type=range]):not([type=checkbox]):not([type=file]),textarea,select,[contenteditable]');
 if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.key==='Enter'&&t.classList&&(t.classList.contains('pcard')||t.classList.contains('prow')||t.classList.contains('hero-f'))){A.detail(t);return}
 if(e.key==='?'){A.help();return}
 if(modalStack.length||S.route.name!=='player')return;
 if(t.type==='range'&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))return;
 switch(e.key){case' ':e.preventDefault();togglePlay();break;case'ArrowLeft':e.preventDefault();seekBy(-5);break;case'ArrowRight':e.preventDefault();seekBy(5);break;
  case'f':case'F':toggleFS();break;case'm':case'M':{const v=S.player.v;if(v)v.muted=!v.muted;break}}});
document.addEventListener('keyup',e=>{if(e.key===' '&&S.route.name==='player'&&!modalStack.length&&e.target.tagName==='BUTTON')e.preventDefault()});

/* ============ init ============ */
async function init(){
 S.settings={...DEFAULTS,...(LS.get('settings',{})||{})};
 const s=S.settings;if(!['dark','light'].includes(s.theme))s.theme='dark';if(!['violet','blue','pink','green','orange'].includes(s.accent))s.accent='violet';if(!['s','m','l'].includes(s.grid))s.grid='m';
 s.volume=Math.min(1,Math.max(0,+s.volume||0));if(![0.25,0.5,1,1.5,2].includes(+s.speed))s.speed=1;s.speed=+s.speed;
 let list=LS.get('presets',[]);S.presets=(Array.isArray(list)?list:[]).map(sanitizePreset).filter(Boolean);
 if(!LS.get('seeded',false)){if(!S.presets.length)S.presets=seedDemo();LS.set('seeded',true);LS.set('presets',S.presets)}
 const ids=new Set(S.presets.map(p=>p.id)),lst=k=>(Array.isArray(LS.get(k,[]))?LS.get(k,[]):[]);
 S.opened=lst('opened').filter(o=>o&&ids.has(o.id));S.played=lst('played').filter(o=>o&&ids.has(o.id));S.queue=lst('queue').filter(i=>typeof i==='string'&&ids.has(i));
 await DB.open();
 applySettings();buildChrome();syncSearch();
 S.route=parseHash();render();
 if(!DB.ok)setTimeout(()=>toast('Penyimpanan file permanen (IndexedDB) tidak tersedia. File yang diimpor hanya bertahan selama tab terbuka.','warn'),1200);
 setTimeout(()=>$('#boot').classList.add('hide'),350);setTimeout(()=>$('#boot')&&$('#boot').remove(),1000)}
init().catch(e=>{console.error(e);$('#boot').classList.add('hide');toast('Gagal memulai aplikasi: '+(e&&e.message||e),'error')});
})();
</script>
</body>
</html>
