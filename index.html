<!DOCTYPE html>
<html lang="id" data-theme="dark" data-accent="violet" data-anim="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06060c">
<meta name="description" content="ALIGHT MOTION PRESET PLAYER PRO — Discover • Preview • Organize • Create">
<title>ALIGHT MOTION PRESET PLAYER PRO</title>
<style>
:root{--r:18px;--card-min:200px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);--sbw:256px;--font:Inter,"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
html[data-theme=dark]{--bg:#06060c;--bg2:#0d0d19;--panel:rgba(14,14,26,.78);--card:rgba(255,255,255,.045);--cardh:rgba(255,255,255,.085);--bd:rgba(255,255,255,.09);--tx:#eceeff;--mu:#9b9eba;--shadow:0 10px 40px rgba(0,0,0,.45);--inp:rgba(255,255,255,.06);color-scheme:dark}
html[data-theme=light]{--bg:#f3f4fb;--bg2:#ffffff;--panel:rgba(255,255,255,.82);--card:#ffffff;--cardh:#eef0fa;--bd:rgba(20,20,60,.1);--tx:#171a33;--mu:#62668a;--shadow:0 10px 30px rgba(40,40,100,.12);--inp:rgba(20,20,60,.05);color-scheme:light}
html[data-accent=violet]{--a:#8b5cf6;--b:#38bdf8}
html[data-accent=blue]{--a:#3b82f6;--b:#22d3ee}
html[data-accent=pink]{--a:#ec4899;--b:#8b5cf6}
html[data-accent=green]{--a:#10b981;--b:#38bdf8}
html[data-accent=orange]{--a:#f59e0b;--b:#ef4444}
:root{--grad:linear-gradient(135deg,var(--a),var(--b));--ok:#22c55e;--warn:#f59e0b;--err:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--tx);line-height:1.5;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 500px at 10% -10%,color-mix(in srgb,var(--a) 22%,transparent),transparent 60%),radial-gradient(800px 500px at 100% 10%,color-mix(in srgb,var(--b) 16%,transparent),transparent 60%)}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(1.4rem,3.4vw,2rem);line-height:1.15;letter-spacing:-.01em}
h2{font-size:1.15rem}
h3{font-size:.95rem;font-weight:650}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--b)}
.muted{color:var(--mu)}.sm{font-size:.82rem}.xs{font-size:.74rem}
.ic{flex:none;vertical-align:middle}
.grad-t{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
:focus-visible{outline:2px solid var(--b);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:8px}

/* boot */
.boot{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;transition:opacity .45s,visibility .45s}
.boot.hide{opacity:0;visibility:hidden}
.boot-in{display:grid;gap:16px;justify-items:center;text-align:center}
.boot .logo{width:64px;height:64px;border-radius:20px;animation:pulse 1.4s ease-in-out infinite}
.bar{width:160px;height:4px;border-radius:4px;background:var(--bd);overflow:hidden}
.bar i{display:block;height:100%;width:40%;background:var(--grad);border-radius:4px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 40px -4px var(--a)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes drift{0%{transform:translate(-6%,-4%) rotate(0)}100%{transform:translate(6%,5%) rotate(14deg)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* layout */
.app{display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .25s}
.app.collapsed{--sbw:78px}
.sidebar{position:sticky;top:0;height:100vh;padding:18px 14px;display:flex;flex-direction:column;gap:14px;background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid var(--bd);z-index:30;overflow-y:auto;overflow-x:hidden}
.brand{display:flex;align-items:center;gap:11px;padding:2px 4px;cursor:pointer;min-height:44px}
.logo{width:40px;height:40px;border-radius:13px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 8px 26px -8px var(--a)}
.brand b{display:block;font-size:.74rem;letter-spacing:.07em;line-height:1.2}
.brand small{color:var(--mu);font-size:.68rem}
.nav{display:flex;flex-direction:column;gap:3px;flex:1}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;border-radius:13px;background:transparent;color:var(--mu);text-align:left;font-size:.9rem;font-weight:550;transition:.2s;position:relative;min-height:44px}
.nav button:hover{background:var(--cardh);color:var(--tx)}
.nav button.active{background:color-mix(in srgb,var(--a) 20%,transparent);color:var(--tx)}
.nav button.active::before{content:"";position:absolute;left:-14px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--grad)}
.nav .cnt{margin-left:auto;font-size:.7rem;background:var(--grad);color:#fff;border-radius:999px;padding:1px 7px;font-weight:700}
.collapsed .nav .l,.collapsed .brand .bt,.collapsed .nav .cnt,.collapsed .sb-foot .l{display:none}
.collapsed .nav button{justify-content:center;padding:11px 0}
.collapsed .nav button.active::before{left:-14px}
.sb-foot{display:flex;flex-direction:column;gap:6px}
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px clamp(14px,3vw,28px);padding-top:calc(12px + var(--safe-t));background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
.top-brand{display:none;align-items:center;gap:8px;font-weight:800;font-size:.8rem;letter-spacing:.05em}
.top-brand .logo{width:34px;height:34px;border-radius:11px}
.search{position:relative;flex:1;max-width:560px}
.search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mu);pointer-events:none}
.search input{padding-left:40px;padding-right:38px;height:44px;border-radius:14px}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:10px;border:0;background:transparent;display:none;place-items:center;color:var(--mu)}
.search.has .clr{display:grid}
.top-act{display:flex;gap:8px;margin-left:auto}
#view{padding:clamp(14px,3vw,28px);max-width:1500px;margin:0 auto}
#view.enter{animation:rise .35s ease both}
.page{display:flex;flex-direction:column;gap:22px}
.page-h{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:12px}
.bottom-nav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--bd);padding:6px 8px calc(6px + var(--safe-b));justify-content:space-around}
.bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;color:var(--mu);font-size:.66rem;padding:6px 2px;border-radius:12px;min-height:50px;max-width:90px}
.bottom-nav button.active{color:var(--tx);background:color-mix(in srgb,var(--a) 20%,transparent)}
@media(max-width:860px){
 .app{grid-template-columns:minmax(0,1fr)}.sidebar{display:none}.bottom-nav{display:flex}.top-brand{display:flex}
 #view{padding-bottom:calc(100px + var(--safe-b))}
 .top-act .hide-m{display:none}
 .search{max-width:none}
 .top-brand span{display:none}
}

/* ui */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:13px;border:1px solid var(--bd);background:var(--card);font-weight:600;font-size:.9rem;transition:.2s;white-space:nowrap;text-decoration:none;color:var(--tx)}
.btn:hover{background:var(--cardh);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 24px -10px var(--a)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{background:color-mix(in srgb,var(--err) 18%,transparent);border-color:color-mix(in srgb,var(--err) 45%,transparent);color:#ff8a8a}
html[data-theme=light] .btn.danger{color:#c01818}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:.82rem;border-radius:11px}
.btn[disabled],.btn.off{opacity:.45;cursor:not-allowed;transform:none}
.icon-btn{width:44px;height:44px;border-radius:13px;border:1px solid var(--bd);background:var(--card);display:inline-grid;place-items:center;transition:.2s;flex:none}
.icon-btn:hover{background:var(--cardh)}
.icon-btn.sm{width:36px;height:36px;border-radius:11px}
.icon-btn.on{color:#ff5c8a;border-color:#ff5c8a55}
.icon-btn.danger:hover{color:var(--err)}
.input,select.input,textarea.input{width:100%;background:var(--inp);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:10px 13px;font:inherit;min-height:44px;transition:.2s}
textarea.input{resize:vertical;min-height:84px}
.input:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 25%,transparent)}
select.input option{background:var(--bg2);color:var(--tx)}
.fld{display:flex;flex-direction:column;gap:5px;font-size:.78rem;color:var(--mu);font-weight:600;min-width:0}
.form{display:flex;flex-direction:column;gap:13px}
.err{color:var(--err);font-size:.84rem;min-height:1em}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--bd);font-size:.8rem;font-weight:600;color:var(--tx);cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--a)}
.chip.on{background:color-mix(in srgb,var(--a) 22%,transparent);border-color:var(--a)}
.chip b{color:var(--mu);font-weight:700}
.tag{font-size:.7rem;color:var(--b);background:color-mix(in srgb,var(--b) 12%,transparent);padding:2px 8px;border-radius:999px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.badge{position:absolute;top:9px;left:9px;font-size:.66rem;font-weight:800;letter-spacing:.05em;padding:3px 8px;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;backdrop-filter:blur(6px);z-index:2}
.badge.demo{left:auto;right:auto;top:auto;bottom:9px;background:linear-gradient(135deg,#f59e0b,#ef4444)}
.seg{display:inline-flex;background:var(--inp);border:1px solid var(--bd);border-radius:13px;padding:3px}
.seg button{border:0;background:transparent;padding:0 12px;min-height:36px;border-radius:10px;color:var(--mu);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:.82rem;font-weight:600}
.seg.big button{min-height:44px;padding:0 16px;font-size:.88rem}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;font-size:.84rem}
textarea.mono{line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;tab-size:2}
.pre-out{max-height:50vh;overflow:auto;white-space:pre;font-family:ui-monospace,Consolas,"Courier New",monospace;background:var(--inp);border:1px solid var(--bd);border-radius:12px;padding:12px;font-size:.78rem;line-height:1.5;margin:0}
.meta-grid .full{grid-column:1/-1}
.kvlist{display:flex;flex-wrap:wrap;gap:6px}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg button.on{background:var(--grad);color:#fff}
.switch{position:relative;display:inline-block;width:48px;height:28px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:2}
.switch span{position:absolute;inset:0;background:var(--inp);border:1px solid var(--bd);border-radius:999px;transition:.2s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--mu);transition:.2s}
.switch input:checked+span{background:var(--grad);border-color:transparent}
.switch input:checked+span::after{transform:translateX(20px);background:#fff}
input[type=range]{accent-color:var(--a);width:100%;min-height:28px;margin:0}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--bd);border-top-color:var(--a);animation:spin .8s linear infinite;display:inline-block}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--b) 10%,transparent);border:1px solid color-mix(in srgb,var(--b) 30%,transparent);font-size:.86rem}
.notice.warn{background:color-mix(in srgb,var(--warn) 12%,transparent);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.notice.bad{background:color-mix(in srgb,var(--err) 12%,transparent);border-color:color-mix(in srgb,var(--err) 40%,transparent)}
.notice ul{margin:4px 0 0;padding-left:18px}

/* thumbs */
.vis{position:absolute;inset:0;overflow:hidden;background:linear-gradient(135deg,hsl(var(--h) 75% 24%),hsl(calc(var(--h) + 55) 80% 11%))}
.vis::before{content:"";position:absolute;inset:-30%;background:radial-gradient(circle at 28% 30%,hsl(var(--h) 100% 66%/.55),transparent 42%),radial-gradient(circle at 76% 72%,hsl(calc(var(--h) + 60) 100% 62%/.45),transparent 40%);animation:drift 9s ease-in-out infinite alternate}
.vis-ic{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.82)}
.vis img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.vis.has-img::before,.vis.has-img .vis-ic{display:none}
.pcard{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s;display:flex;flex-direction:column;min-width:0}
.pcard:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--a) 60%,transparent);box-shadow:0 18px 40px -18px var(--a)}
.thumb{position:relative;aspect-ratio:16/10;overflow:hidden}
.thumb .fav,.thumb .play{position:absolute;z-index:3;width:38px;height:38px;border-radius:12px;border:0;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(6px);transition:.2s}
.thumb .fav{top:8px;right:8px}
.thumb .fav.on{color:#ff5c8a}
.thumb .play{right:8px;bottom:8px;background:var(--grad);opacity:0;transform:scale(.85)}
.pcard:hover .play,.pcard:focus-within .play{opacity:1;transform:none}
@media(hover:none){.thumb .play{opacity:1;transform:none}}
.pbody{padding:12px 13px 8px;display:flex;flex-direction:column;gap:6px;flex:1}
.pbody h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pact{display:flex;gap:4px;padding:2px 8px 10px;justify-content:flex-end}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card-min),1fr));gap:14px}
.hrow{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 10px}
.hrow>.pcard{flex:0 0 min(230px,72vw);scroll-snap-align:start}
.plist{display:flex;flex-direction:column;gap:10px}
.prow{display:grid;grid-template-columns:132px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:8px;cursor:pointer;transition:.2s}
.prow:hover{border-color:var(--a)}
.prow .thumb{border-radius:11px}
.prow .meta{min-width:0;display:flex;flex-direction:column;gap:4px}
.prow .meta h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pact{padding:0 4px;flex-wrap:wrap}
@media(max-width:620px){.prow{grid-template-columns:96px minmax(0,1fr)}.prow .pact{grid-column:1/-1;justify-content:flex-start;padding:0 4px 4px}}

/* hero + stats */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;padding:clamp(18px,3vw,32px);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:320px;height:320px;border-radius:50%;background:var(--grad);filter:blur(90px);opacity:.25;pointer-events:none}
.hero-t{display:flex;flex-direction:column;gap:14px;justify-content:center;position:relative;z-index:1}
.hero-t h1{font-size:clamp(1.6rem,4.4vw,2.7rem);letter-spacing:.01em;font-weight:850}
.eyebrow{font-size:.76rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--b)}
.hero-a{display:flex;gap:10px;flex-wrap:wrap}
.hero-f{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:16/10;cursor:pointer;z-index:1;border:1px solid var(--bd);min-height:160px}
.hero-f .cap{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.78));z-index:2;color:#fff}
.hero-f .cap .eyebrow{color:#9fe3ff}
@media(max-width:860px){.hero{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{padding:16px;display:flex;align-items:center;gap:13px;cursor:pointer;transition:.2s}
.stat:hover{border-color:var(--a)}
.stat .si{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--a) 20%,transparent);color:var(--b)}
.stat b{font-size:1.5rem;line-height:1;display:block}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:44px 20px;border:1px dashed var(--bd);border-radius:var(--r);background:var(--card)}
.empty .ei{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;background:color-mix(in srgb,var(--a) 18%,transparent);color:var(--b)}
.empty p{max-width:440px;color:var(--mu);font-size:.92rem}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:14px}
.filters .fld{flex:1 1 150px}

/* player */
.player-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media(max-width:1100px){.player-grid{grid-template-columns:minmax(0,1fr)}}
@media(max-height:520px) and (orientation:landscape){.player-grid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}.bottom-nav button span{display:none}.bottom-nav button{min-height:40px}}
.stage{position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;max-height:74vh;width:100%;display:grid;place-items:center;border:1px solid var(--bd);box-shadow:var(--shadow)}
.stage:fullscreen{aspect-ratio:auto;max-height:none;border-radius:0;border:0}
.stage:-webkit-full-screen{aspect-ratio:auto;max-height:none;border-radius:0}
.stage video,.stage img.pv{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.stage-ov{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:20px;z-index:3}
.stage-ov.show{display:grid}
.stage-ov .box{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:420px;position:relative;z-index:2;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.stage-ov.ph{background:transparent}
.stage-ov.ld{background:rgba(0,0,0,.35)}
.stage-ov.er{background:rgba(0,0,0,.72)}
.ph-badge{font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:8px 16px;border-radius:12px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);font-size:.9rem}
.bigplay{position:absolute;z-index:2;width:72px;height:72px;border-radius:50%;border:0;background:var(--grad);color:#fff;display:none;place-items:center;box-shadow:0 10px 40px -6px var(--a)}
.stage.paused .bigplay{display:grid}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px;margin-top:12px}
.seek{flex:1 1 100%;display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--mu)}
.vol{display:flex;align-items:center;gap:6px;width:150px}
.ctrl .sp{flex:1}
.ctrl select{width:auto;min-height:44px}
.pl-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.side{display:flex;flex-direction:column;gap:14px}
.mini{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center;padding:6px;border-radius:12px;cursor:pointer}
.mini:hover{background:var(--cardh)}
.mini .thumb{border-radius:9px}
.mini h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.86rem}

/* detail */
.detail{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:960px){.detail{grid-template-columns:minmax(0,1fr)}}
.detail .thumb{border-radius:var(--r);aspect-ratio:16/10}
.meta-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.meta-grid>div{background:var(--inp);border:1px solid var(--bd);border-radius:12px;padding:9px 12px;min-width:0}
.meta-grid>div>span:first-child{display:block;font-size:.7rem;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.meta-grid b{font-size:.9rem;word-break:break-word;font-weight:600}
.steps{margin:6px 0 0;padding-left:20px;color:var(--mu);font-size:.88rem;display:grid;gap:4px}

/* tables */
.tablewrap{overflow:auto}
.ftable{width:100%;border-collapse:collapse;font-size:.88rem}
.ftable th{text-align:left;font-size:.72rem;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;padding:12px 14px;border-bottom:1px solid var(--bd);white-space:nowrap}
.ftable td{padding:11px 14px;border-bottom:1px solid var(--bd);vertical-align:middle}
.ftable tr:last-child td{border-bottom:0}
.ftable .nm{min-width:180px;max-width:320px;word-break:break-word}
.ftable .acts{display:flex;gap:4px;justify-content:flex-end}
.st{display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border-radius:999px;font-size:.74rem;font-weight:700;background:var(--inp)}
.st.ok{color:var(--ok)}.st.bad{color:var(--err)}.st.mu{color:var(--mu)}.st.warn{color:var(--warn)}
@media(max-width:760px){.ftable thead{display:none}.ftable tr{display:block;padding:10px 6px;border-bottom:1px solid var(--bd)}.ftable td{display:flex;justify-content:space-between;gap:10px;border:0;padding:5px 10px}.ftable td::before{content:attr(data-l);color:var(--mu);font-size:.72rem;font-weight:700;text-transform:uppercase}.ftable td.nm{display:block;max-width:none}.ftable td.nm::before{display:none}}

/* import */
.drop{border:2px dashed var(--bd);border-radius:var(--r);padding:34px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--card);cursor:pointer;transition:.2s}
.drop:hover,.drop.over{border-color:var(--a);background:color-mix(in srgb,var(--a) 10%,transparent)}
.stg{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;padding:14px}
@media(max-width:700px){.stg{grid-template-columns:1fr}}
.stg .thumb{border-radius:12px}
.stg-f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stg-f .wide{grid-column:1/-1}
@media(max-width:700px){.stg-f{grid-template-columns:1fr}}
.prog{height:8px;border-radius:8px;background:var(--bd);overflow:hidden}
.prog i{display:block;height:100%;background:var(--grad);width:0;transition:width .2s}
.qr-box{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:4/3;max-width:460px;display:grid;place-items:center;border:1px solid var(--bd)}
.qr-box video,.qr-box img{width:100%;height:100%;object-fit:contain}
.qr-frame{position:absolute;inset:18%;border:3px solid var(--b);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--bd)}
.set-row:last-child{border-bottom:0}
.set-row .t{min-width:0}
.set-row .t b{display:block;font-size:.92rem}
.set-row .ctl{flex:none;display:flex;align-items:center;gap:8px;min-width:0}
.sw-color{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.sw-color.on{border-color:var(--tx)}
.kbd{display:inline-block;min-width:26px;text-align:center;padding:2px 8px;border-radius:8px;background:var(--inp);border:1px solid var(--bd);font-family:ui-monospace,Consolas,monospace;font-size:.8rem}
.klist{display:grid;gap:8px}
.klist div{display:flex;justify-content:space-between;gap:12px;align-items:center}

/* toast + modal */
#toasts{position:fixed;right:16px;bottom:calc(16px + var(--safe-b));z-index:120;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px));pointer-events:none}
@media(max-width:860px){#toasts{right:12px;left:12px;max-width:none;bottom:calc(84px + var(--safe-b))}}
.toast{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--bg2);border:1px solid var(--bd);box-shadow:var(--shadow);font-size:.88rem;animation:rise .25s both;pointer-events:auto;border-left:4px solid var(--b)}
.toast.success{border-left-color:var(--ok)}.toast.error{border-left-color:var(--err)}.toast.warn{border-left-color:var(--warn)}
.toast .ti{margin-top:1px}
.toast.out{opacity:0;transform:translateX(20px);transition:.25s}
.modal-wrap{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .18s both}
.modal-wrap.out{opacity:0;transition:.16s}
.modal{background:var(--bg2);border:1px solid var(--bd);border-radius:22px;width:min(520px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:var(--shadow);animation:rise .22s both}
.modal.wide{width:min(720px,100%)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 8px}
.modal-b{overflow:auto;padding:6px 20px 18px;font-size:.92rem}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px calc(16px + var(--safe-b));border-top:1px solid var(--bd);flex-wrap:wrap}
@media(max-width:620px){.modal-wrap.sheet{place-items:end center;padding:0}.modal-wrap.sheet .modal{border-radius:22px 22px 0 0;width:100%}}
.more-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.more-grid button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:14px;border:1px solid var(--bd);background:var(--card);font-size:.78rem;min-height:76px}
html[data-anim=off] *,html[data-anim=off] *::before,html[data-anim=off] *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

rows:'<path d="M4 6h16M4 12h16M4 18h16"/>',sparkles:'<path d="M12 3l1.8 4.7L18.5 9.5 13.8 11.3 12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',

/* ============ konstanta ============ */

const VIDEO_EXT=['mp4','webm','mov','m4v'],IMG_EXT=['png','jpg','jpeg','gif','webp'],AUDIO_EXT=['mp3','wav','ogg','m4a'];
const BLOCK_EXT=['exe','apk','bat','cmd','sh','js','mjs','html','htm','svg','php','jar','msi','dll','vbs','ps1','scr','com','lnk','xhtml'];
const MIME={mp4:'video/mp4',webm:'video/webm',mov:'video/quicktime',m4v:'video/x-m4v',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',mp3:'audio/mpeg',wav:'audio/wav',ogg:'audio/ogg',m4a:'audio/mp4',xml:'application/xml',zip:'application/zip'};

const BOTTOM=['home','library','player','queue','more'];

/* ============ storage ============ */
const LS={
 get(k,d){try{const v=localStorage.getItem('ampp.'+k);return v==null?d:JSON.parse(v)}catch{return d}},

 del(k){try{localStorage.removeItem('ampp.'+k)}catch{}}};
const DB={db:null,mem:new Map(),ok:false,
 open(){return new Promise(res=>{try{if(!window.indexedDB)return res(false);const r=indexedDB.open('ampp-files',1);r.onupgradeneeded=()=>{r.result.createObjectStore('blobs')};r.onsuccess=()=>{this.db=r.result;this.ok=true;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false)}catch(e){res(false)}})},
 tx(mode,fn){return new Promise((res,rej)=>{try{const t=this.db.transaction('blobs',mode);const rq=fn(t.objectStore('blobs'));t.oncomplete=()=>res(rq?rq.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('abort'))}catch(e){rej(e)}})},
 async put(k,v){if(!this.db){this.mem.set(k,v);return}await this.tx('readwrite',s=>s.put(v,k))},
 async get(k){if(!this.db)return this.mem.get(k)||null;return (await this.tx('readonly',s=>s.get(k)))||null},

const URLS=new Map();
async function blobURL(key){if(URLS.has(key))return URLS.get(key);const b=await DB.get(key);if(!b)return null;const u=URL.createObjectURL(b);URLS.set(key,u);return u}
function dropURL(key){const u=URLS.get(key);if(u){URL.revokeObjectURL(u);URLS.delete(key)}}
const isQuota=e=>e&&(e.name==='QuotaExceededError'||/quota/i.test(String(e.message)));

/* ============ state ============ */
const S={presets:[],settings:{...DEFAULTS},opened:[],played:[],queue:[],activeId:null,route:{name:'home',id:null},depth:0,

 staged:[],busy:false,qr:{result:null,imgUrl:null,imgBlob:null,stream:null,timer:null,scanning:false,err:''},

const byId=id=>S.presets.find(p=>p.id===id)||null;

function safeUrlOrEmpty(u){return safeUrl(u)?String(u).trim():''}
function sanitizePreset(o){
 if(!o||typeof o!=='object')return null;
 const str=(v,n)=>typeof v==='string'?v.slice(0,n):'';
 const name=str(o.name,80).trim();if(!name)return null;
 const num=v=>typeof v==='number'&&isFinite(v)&&v>=0?v:null;
 return{id:/^[a-z0-9_-]{4,40}$/i.test(o.id||'')?o.id:uid(),name,creator:str(o.creator,60).trim()||null,
  category:CATS.includes(o.category)?o.category:'Custom Preset',description:str(o.description,600),
  tags:Array.isArray(o.tags)?o.tags.filter(t=>typeof t==='string').map(t=>t.trim().slice(0,24)).filter(Boolean).slice(0,12):[],
  ext:str(o.ext,12).toLowerCase().replace(/[^a-z0-9]/g,''),prevExt:str(o.prevExt,12).toLowerCase().replace(/[^a-z0-9]/g,''),fileName:str(o.fileName,160),
  size:num(o.size),resolution:/^\d{2,5}x\d{2,5}$/.test(o.resolution||'')?o.resolution:null,duration:num(o.duration),
  added:num(o.added)||Date.now(),fav:!!o.fav,opens:Math.floor(num(o.opens)||0),plays:Math.floor(num(o.plays)||0),
  demo:!!o.demo,kind:o.kind==='link'||o.kind==='xml'?o.kind:'file',sourceUrl:safeUrlOrEmpty(str(o.sourceUrl,2000)),linkType:['alight-share','alight-other','web'].includes(o.linkType)?o.linkType:'',pageTitle:str(o.pageTitle,200).trim()||null,
  hasMain:!!o.hasMain,hasPrev:!!o.hasPrev,hasThumb:!!o.hasThumb}}

/* ============ toast / modal ============ */
function toast(msg,type='info'){const box=$('#toasts');if(!box)return;const t=document.createElement('div');t.className='toast '+type;t.setAttribute('role',type==='error'?'alert':'status');
 t.innerHTML=`<span class="ti">${ic(type==='success'?'check':type==='error'||type==='warn'?'alert':'info',18)}</span><span>${esc(msg)}</span>`;
 box.appendChild(t);while(box.children.length>4)box.firstChild.remove();
 setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),260)},type==='error'?5600:3400)}
let modalStack=[];
function openModal({title,body,actions=[],wide=false,sheet=false,onMount}){
 const wrap=document.createElement('div');wrap.className='modal-wrap'+(sheet?' sheet':'');
 wrap.innerHTML=`<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h"><h2>${esc(title)}</h2><button class="icon-btn sm" data-mclose aria-label="Tutup">${ic('x',18)}</button></div><div class="modal-b">${body}</div>${actions.length?`<div class="modal-f">${actions.map((a,i)=>`<button class="btn ${a.cls||'ghost'}" data-mi="${i}">${esc(a.label)}</button>`).join('')}</div>`:''}</div>`;
 const last=document.activeElement;let closed=false;
 const api={wrap,onClose:null,close(v){if(closed)return;closed=true;wrap.classList.add('out');setTimeout(()=>wrap.remove(),170);modalStack=modalStack.filter(m=>m!==api);try{last&&last.focus&&last.focus()}catch{}api.onClose&&api.onClose(v)}};
 wrap.addEventListener('mousedown',e=>{if(e.target===wrap)api.close()});
 wrap.addEventListener('click',async e=>{
  if(e.target.closest('[data-mclose]')){api.close();return}
  const b=e.target.closest('[data-mi]');if(!b)return;const a=actions[+b.dataset.mi];if(b.disabled)return;b.disabled=true;
  try{const r=await(a.run&&a.run(wrap,api.close));if(r!==false)api.close(true)}catch(err){console.error(err);toast('Terjadi kesalahan: '+(err&&err.message||err),'error')}finally{b.disabled=false}});
 document.body.appendChild(wrap);modalStack.push(api);
 const f=wrap.querySelector('input:not([type=file]),textarea,select,.btn.primary,.btn.danger');setTimeout(()=>{try{(f||wrap.querySelector('button')).focus()}catch{}},30);
 onMount&&onMount(wrap);return api}
const closeAllModals=()=>[...modalStack].forEach(m=>m.close());
function confirmBox(title,msg,okLabel='Ya',danger=false){return new Promise(res=>{let ok=false;const m=openModal({title,body:`<p style="white-space:pre-line">${esc(msg)}</p>`,actions:[{label:'Batal'},{label:okLabel,cls:danger?'danger':'primary',run:()=>{ok=true}}]});m.onClose=()=>res(ok)})}
async function copyText(t){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);return true}}catch{}
 try{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch{return false}}

function hydrateThumbs(root=document){$$('[data-thumb]',root).forEach(async el=>{const id=el.dataset.thumb;if(!id||el.dataset.done)return;el.dataset.done='1';const u=await blobURL(id+':thumb').catch(()=>null);if(u&&el.isConnected){el.classList.add('has-img');const im=new Image();im.alt='';im.decoding='async';im.src=u;el.appendChild(im)}})}
const actBtns=p=>`<button class="icon-btn sm" data-act="qadd" data-id="${p.id}" title="Tambah ke antrean" aria-label="Tambah ke antrean">${ic('list',16)}</button><button class="icon-btn sm" data-act="edit" data-id="${p.id}" title="Edit metadata" aria-label="Edit metadata">${ic('edit',16)}</button><button class="icon-btn sm danger" data-act="del" data-id="${p.id}" title="Hapus preset" aria-label="Hapus preset">${ic('trash',16)}</button>`;
const thumbBlock=p=>`<div class="thumb">${visual(p)}<span class="badge">${esc(fmtLabel(p))}</span>${p.demo?'<span class="badge demo">DEMO</span>':''}<button class="fav ${p.fav?'on':''}" data-act="fav" data-id="${p.id}" aria-label="Favorit" title="Favorit">${ic('heart',18)}</button><button class="play" data-act="play" data-id="${p.id}" aria-label="Putar preview" title="Putar preview">${ic('play',18)}</button></div>`;

function prow(p){return `<article class="prow" data-act="detail" data-id="${p.id}" tabindex="0" aria-label="${esc(p.name)}">${thumbBlock(p)}<div class="meta"><h3 title="${esc(p.name)}">${esc(p.name)}</h3><p class="muted xs">${esc(p.category)} · ${esc(p.creator||'Pembuat tidak diketahui')} · ${esc(fmtLabel(p))} · ${p.kind==='link'?'Tautan':fmtSize(p.size)} · ${esc(sourceLabel(p))}</p><div class="tags">${p.tags.slice(0,4).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div></div><div class="pact">${actBtns(p)}</div></article>`}
const emptyState=(icon,title,text,actions='')=>`<div class="empty"><div class="ei">${ic(icon,34)}</div><h2>${esc(title)}</h2><p>${esc(text)}</p><div class="row-actions" style="justify-content:center">${actions}</div></div>`;

const popularScore=p=>p.opens+p.plays*2+(p.fav?3:0);
const popular=()=>S.presets.filter(p=>popularScore(p)>0).sort((a,b)=>popularScore(b)-popularScore(a));
function matches(p,q){if(!q)return true;const hay=[p.name,p.creator||'',p.category,p.tags.join(' '),p.ext,fmtLabel(p),p.description].join(' ').toLowerCase();return q.toLowerCase().split(/\s+/).filter(Boolean).every(t=>hay.includes(t))}
function filtered(){const L=S.lib;let r=S.presets.filter(p=>matches(p,L.q)&&(L.cat==='all'||p.category===L.cat)&&(L.fmt==='all'||groupOfPreset(p)===L.fmt)&&(!L.fav||p.fav));
 const s={new:(a,b)=>b.added-a.added,old:(a,b)=>a.added-b.added,name:(a,b)=>a.name.localeCompare(b.name,'id'),popular:(a,b)=>popularScore(b)-popularScore(a)}[L.sort]||((a,b)=>b.added-a.added);return r.sort(s)}
const previewKey=p=>p.hasPrev?p.id+':prev':(p.hasMain&&['video','image'].includes(groupOf(p.ext))?p.id+':main':null);

function parseHash(){const h=location.hash.replace(/^#\/?/,'');const [name,id]=h.split('/');if(ROUTES[name])return{name,id:id||null};return{name:'home',id:null}}
function go(path){closeAllModals();S.depth++;const t='#/'+path;if(location.hash===t)onRoute();else location.hash=t}
function cleanup(){stopPlayer();stopScan()}

 try{html=(VIEWS[r.name]||VIEWS.home)(r)}catch(e){console.error(e);html=emptyState('alert','Terjadi kesalahan','Halaman tidak dapat ditampilkan: '+(e&&e.message||e),'<button class="btn primary" data-act="go" data-go="home">Ke Home</button>')}

  <label class="fld"><span>Urutkan</span><select class="input" data-in="lib-sort">${[['new','Terbaru'],['old','Terlama'],['name','Nama (A–Z)'],['popular','Terpopuler']].map(([v,t])=>`<option value="${v}" ${L.sort===v?'selected':''}>${t}</option>`).join('')}</select></label>

VIEWS.favorites=()=>{const f=S.presets.filter(p=>p.fav).sort((a,b)=>b.added-a.added);
 return `<section class="page"><div class="page-h"><div><h1>Favorites</h1><p class="muted">${f.length} preset favorit</p></div>${f.length?`<button class="btn danger" data-act="fav-clear">${ic('trash',16)}Hapus semua favorit</button>`:''}</div>${f.length?`<div class="grid">${f.map(pcard).join('')}</div>`:emptyState('heart','Belum ada favorit','Tekan ikon hati pada kartu preset untuk menyimpannya di sini.','<button class="btn primary" data-act="go" data-go="library">Buka Library</button>')}</section>`};
VIEWS.recent=()=>{const sec=(list,title,clr,sub)=>{const items=list.map(o=>({p:byId(o.id),t:o.t})).filter(x=>x.p);return `<div>${secHead(title,sub,items.length?`<button class="btn danger sm" data-act="${clr}">${ic('trash',14)}Hapus riwayat</button>`:'')}${items.length?`<div class="plist">${items.map(x=>`<div>${prow(x.p)}<p class="muted xs" style="margin:3px 8px 0">${new Date(x.t).toLocaleString('id-ID')}</p></div>`).join('')}</div>`:'<p class="muted sm">Belum ada riwayat.</p>'}</div>`};
 return `<section class="page"><div class="page-h"><div><h1>Recent</h1><p class="muted">Riwayat tersimpan hanya di perangkat ini.</p></div></div>${sec(S.opened,'Terakhir dibuka','opened-clear','Preset yang kamu buka detailnya atau playernya')}${sec(S.played,'Preview yang baru diputar','played-clear','Hanya tercatat saat video/preview benar-benar diputar')}</section>`};

VIEWS.queue=()=>{const q=S.queue.map(byId).filter(Boolean);
 return `<section class="page"><div class="page-h"><div><h1>Queue</h1><p class="muted">${q.length} preset dalam antrean preview</p></div><div class="row-actions">${q.length?`<button class="btn primary" data-act="qstart">${ic('play',16)}Putar antrean</button><button class="chip ${S.settings.repeatQueue?'on':''}" data-act="qrepeat" style="min-height:44px">${ic('repeat',16)}Ulangi</button><button class="btn danger" data-act="qclear">${ic('trash',16)}Hapus semua</button>`:''}</div></div>
 ${q.length?`<div class="plist">${q.map((p,i)=>`<div class="prow" style="grid-template-columns:34px 110px minmax(0,1fr) auto"><b class="muted" style="text-align:center">${i+1}</b><div class="thumb">${visual(p)}</div><div class="meta"><h3>${esc(p.name)}</h3><p class="muted xs">${esc(p.category)} · ${previewKey(p)?'Preview tersedia':'<span style="color:var(--warn)">Preview belum tersedia</span>'}</p></div><div class="pact"><button class="icon-btn sm" data-act="qplay" data-id="${p.id}" aria-label="Putar" title="Putar">${ic('play',16)}</button><button class="icon-btn sm" data-act="qup" data-i="${i}" ${i===0?'disabled':''} aria-label="Naikkan" title="Naikkan">${ic('up',16)}</button><button class="icon-btn sm" data-act="qdn" data-i="${i}" ${i===q.length-1?'disabled':''} aria-label="Turunkan" title="Turunkan">${ic('down',16)}</button><button class="icon-btn sm danger" data-act="qrem" data-id="${p.id}" aria-label="Hapus dari antrean" title="Hapus dari antrean">${ic('x',16)}</button></div></div>`).join('')}</div>`:emptyState('list','Antrean kosong','Tambahkan preset lewat ikon daftar pada kartu atau halaman detail.','<button class="btn primary" data-act="go" data-go="library">Buka Library</button>')}</section>`};
AFTER.queue=()=>{};

VIEWS.detail=r=>{const p=byId(r.id);if(!p)return emptyState('alert','Preset tidak ditemukan','Preset ini mungkin sudah dihapus.','<button class="btn primary" data-act="go" data-go="library">Ke Library</button>');
 if(!S.noTrack)trackOpen(p);S.activeId=p.id;
 const src=safeUrl(p.sourceUrl);const canDl=p.hasMain||src;
 const dlLabel=p.hasMain?'Download':(src?(p.linkType==='alight-share'?'Buka Halaman Import':'Buka Tautan'):'Download');
 const altNotice=(p.kind==='link'&&p.linkType==='alight-share')?`<div class="notice">${ic('info',18)}<div>Ini <b>link berbagi Alight Motion</b>, bukan file unduhan. Buka halaman resminya di tab baru; impor dilakukan di sana atau di aplikasi Alight Motion (perangkat yang didukung, versi terbaru). Player ini tidak mengunduh paket dan tidak mengimpor ke aplikasi.</div></div>`:'';
 const similar=S.presets.filter(x=>x.id!==p.id&&(x.category===p.category||x.tags.some(t=>p.tags.includes(t)))).slice(0,6);
 const unk='<span class="muted">Belum diketahui</span>';
 const steps=`<ol class="steps"><li>Putar preview untuk memastikan preset sesuai kebutuhan.</li><li>Unduh file preset (jika tersedia) atau buka tautan sumbernya.</li><li>Impor ke Alight Motion dari aplikasinya (langkah dan format yang didukung dapat berbeda antar versi aplikasi).</li><li>Sesuaikan durasi dan parameter di proyekmu.</li></ol>`;
 return `<section class="page"><div class="page-h"><button class="btn ghost" data-act="back">${ic('back',18)}Kembali</button><div class="row-actions"><button class="btn" data-act="edit" data-id="${p.id}">${ic('edit',16)}Edit</button><button class="btn danger" data-act="del" data-id="${p.id}">${ic('trash',16)}Hapus</button></div></div>
 <div class="detail"><div style="display:flex;flex-direction:column;gap:12px"><div class="thumb card" style="overflow:hidden">${visual(p)}<span class="badge">${esc(fmtLabel(p))}</span>${p.demo?'<span class="badge demo">DEMO</span>':''}</div>
  <div class="row-actions"><button class="btn primary" data-act="play" data-id="${p.id}">${ic('play',16)}Putar preview</button><button class="btn" data-act="fav" data-id="${p.id}" data-favlabel="${p.id}" data-long="1">${ic('heart',16)} ${p.fav?'Favorit':'Tambah favorit'}</button><button class="btn" data-act="qadd" data-id="${p.id}">${ic('list',16)}Antrean</button></div></div>
 <div class="card pad" style="display:flex;flex-direction:column;gap:14px"><div><span class="eyebrow">${esc(p.category)}</span><h1>${esc(p.name)}</h1></div>
  <p class="${p.description?'':'muted'}">${esc(p.description||'Tidak ada deskripsi.')}</p>
  <div class="tags">${p.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')||'<span class="muted sm">Tanpa tag</span>'}</div>
  <div class="meta-grid"><div><span>Pembuat</span><b>${p.creator?esc(p.creator):unk}</b></div><div><span>Kategori</span><b>${esc(p.category)}</b></div><div><span>Format</span><b>${p.demo?'Tanpa file (demo)':p.kind==='link'?'Tautan':esc((p.ext||'—').toUpperCase())}</b></div><div><span>Ukuran</span><b>${p.size!=null?fmtSize(p.size):unk}</b></div><div><span>Resolusi</span><b>${p.resolution?esc(p.resolution.replace('x',' × ')):unk}</b></div><div><span>Durasi preview</span><b>${p.duration!=null?fmtTime(p.duration):unk}</b></div><div><span>Ditambahkan</span><b>${fmtDate(p.added)}</b></div><div><span>Dibuka / diputar</span><b>${p.opens}× / ${p.plays}×</b></div><div><span>Sumber</span><b>${esc(sourceLabel(p))}</b></div><div><span>${p.kind==='link'?'Jenis tautan':'Nama file'}</span><b>${p.kind==='link'?(p.linkType?esc(LINK_LABEL[p.linkType]):unk):(p.fileName?esc(p.fileName):unk)}</b></div>${p.kind==='link'?`<div class="full"><span>Judul halaman (saat disimpan)</span><b>${p.pageTitle?esc(p.pageTitle):unk}</b></div>`:''}</div>
  ${src?`<div class="sm"><span class="muted">Tautan sumber: </span><a href="${esc(src)}" target="_blank" rel="noopener noreferrer">${esc(new URL(src).hostname)} ${ic('external',13)}</a></div>`:''}
  ${p.demo?`<div class="notice warn">${ic('alert',18)}<div>Ini data demo tanpa file. Tombol unduh dinonaktifkan karena memang tidak ada file yang bisa diunduh.</div></div>`:''}
  ${altNotice}<div class="row-actions"><button class="btn primary ${canDl?'':'off'}" data-act="dl" data-id="${p.id}" ${canDl?'':'disabled'} title="${canDl?(p.hasMain?'Unduh':'Buka tautan sumber'):'Tidak ada file atau tautan untuk diunduh'}">${ic(p.hasMain?'download':'external',16)}${dlLabel}</button><button class="btn" data-act="share" data-id="${p.id}">${ic('share',16)}Share</button><button class="btn" data-act="copy" data-id="${p.id}">${ic('link',16)}Salin link</button>${p.kind==='link'&&src?`<button class="btn" data-act="copy-src" data-id="${p.id}">${ic('copy',16)}Salin link sumber</button>`:''}${p.hasMain&&p.ext==='xml'?`<button class="btn" data-act="xml-view" data-id="${p.id}">${ic('eye',16)}Lihat isi XML</button>`:''}</div>
  <p class="muted xs">Link preset hanya berfungsi di browser dan perangkat ini karena data tersimpan lokal.</p>
  <div><h3>Petunjuk penggunaan</h3>${steps}</div></div></div>
 ${similar.length?`<div>${secHead('Preset serupa')}<div class="hrow">${similar.map(pcard).join('')}</div></div>`:''}</section>`};

/* ----- Player ----- */
VIEWS.player=r=>{const id=r.id||S.activeId;const p=id&&byId(id);
 if(!p)return `<section class="page"><div class="page-h"><div><h1>Player</h1></div></div>${emptyState('film','Belum ada preset aktif','Pilih preset dari library, lalu tekan tombol putar untuk melihat pratinjaunya di sini.','<button class="btn primary" data-act="go" data-go="library">Buka Preset Library</button>')}</section>`;
 S.activeId=p.id;const up=upNext(p);
 return `<section class="page"><div class="page-h"><div style="min-width:0"><button class="btn ghost sm" data-act="back">${ic('back',16)}Kembali ke library</button><h1 style="margin-top:8px">${esc(p.name)}</h1><p class="muted sm">${esc(p.category)} · ${esc(p.creator||'Pembuat tidak diketahui')}</p></div></div>
 <div class="player-grid"><div>
  <div class="stage paused" id="stage"><div id="stage-media" style="display:contents"></div><div class="stage-ov ld show" id="stage-ov"><div class="box"><span class="spin"></span><span>Memuat preview…</span></div></div><button class="bigplay" data-act="pl-toggle" aria-label="Putar">${ic('play',30)}</button></div>
  <div class="card ctrl" id="ctrl"><div class="seek"><span id="t-cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" step="1" data-in="pl-seek" aria-label="Posisi video" disabled><span id="t-dur">0:00</span></div>
   <button class="icon-btn" data-act="pl-prev" aria-label="Preset sebelumnya" title="Sebelumnya">${ic('prev',20)}</button>
   <button class="icon-btn" data-act="pl-back5" aria-label="Mundur 5 detik" title="Mundur 5 detik (←)">${ic('back5',20)}</button>
   <button class="btn primary" id="pl-play" data-act="pl-toggle" aria-label="Putar/jeda" style="width:56px;padding:0" disabled>${ic('play',22)}</button>
   <button class="icon-btn" data-act="pl-fwd5" aria-label="Maju 5 detik" title="Maju 5 detik (→)">${ic('fwd5',20)}</button>
   <button class="icon-btn" data-act="pl-next" aria-label="Preset berikutnya" title="Berikutnya">${ic('next',20)}</button>
   <button class="icon-btn" id="pl-loop" data-act="pl-loop" aria-label="Ulangi video" title="Ulangi video">${ic('repeat',18)}</button>
   <span class="sp"></span>
   <div class="vol"><button class="icon-btn sm" id="pl-mute" data-act="pl-mute" aria-label="Bisukan" title="Bisukan (M)">${ic('volume',18)}</button><input type="range" id="vol" min="0" max="100" value="${Math.round(S.settings.volume*100)}" data-in="pl-vol" aria-label="Volume"></div>
   <select class="input" id="speed" data-in="pl-speed" aria-label="Kecepatan">${[0.25,0.5,1,1.5,2].map(v=>`<option value="${v}" ${v===S.settings.speed?'selected':''}>${v}x</option>`).join('')}</select>
   <button class="icon-btn" data-act="pl-fs" aria-label="Layar penuh" title="Layar penuh (F)">${ic('fullscreen',20)}</button></div>
  <div class="pl-acts"><button class="btn ${p.fav?'on':''}" data-act="fav" data-id="${p.id}" data-favlabel="${p.id}" data-long="1">${ic('heart',18)} ${p.fav?'Favorit':'Tambah favorit'}</button><button class="btn" data-act="detail" data-id="${p.id}">${ic('info',16)}Detail</button><button class="btn" data-act="qadd" data-id="${p.id}">${ic('list',16)}Antrean</button><button class="btn" data-act="copy" data-id="${p.id}">${ic('link',16)}Salin link</button><button class="btn ghost" data-act="go" data-go="library">${ic('library',16)}Library</button></div></div>
 <aside class="side"><div class="card pad"><h3>Info preset</h3><div class="meta-grid" style="margin-top:10px"><div><span>Format</span><b>${esc(fmtLabel(p))}</b></div><div><span>Ukuran</span><b>${p.size!=null?fmtSize(p.size):'—'}</b></div><div><span>Resolusi</span><b id="i-res">${p.resolution?esc(p.resolution.replace('x',' × ')):'—'}</b></div><div><span>Durasi</span><b id="i-dur">${p.duration!=null?fmtTime(p.duration):'—'}</b></div></div><div class="tags" style="margin-top:10px">${p.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div></div>
  <div class="card pad"><h3>${S.queue.length?'Berikutnya di antrean':'Preset lainnya'}</h3><div style="margin-top:8px">${up.length?up.map(x=>`<div class="mini" data-act="play" data-id="${x.id}"><div class="thumb">${visual(x)}</div><div style="min-width:0"><h3>${esc(x.name)}</h3><p class="muted xs">${esc(x.category)}</p></div></div>`).join(''):'<p class="muted sm">Tidak ada preset lain.</p>'}</div></div></aside></div></section>`};
function orderList(){return S.queue.length?S.queue.map(byId).filter(Boolean):filtered()}
function upNext(p){const l=orderList();const i=l.findIndex(x=>x.id===p.id);return (i<0?l:[...l.slice(i+1),...l.slice(0,i)]).filter(x=>x.id!==p.id).slice(0,5)}
function setOverlay(kind,html){const ov=$('#stage-ov');if(!ov)return;ov.className='stage-ov '+({ld:'ld',er:'er',ph:'ph'}[kind]||'')+(kind?' show':'');ov.innerHTML=html||''}
function placeholderOverlay(p,msg){const ov=$('#stage-ov');if(!ov)return;ov.className='stage-ov ph show';ov.style.background='';ov.innerHTML=`<div class="vis" style="--h:${catHue(p.category)}"><span class="vis-ic" style="opacity:.25">${ic('film',120)}</span></div><div class="box"><span class="ph-badge">Preview Belum Tersedia</span><span class="sm">${esc(msg)}</span></div>`}
async function mountPlayer(p){
 const media=$('#stage-media');if(!media)return;
 const tok=Symbol('pl');S.player={id:p.id,v:null,logged:false,loop:S.player.loop,token:tok};trackOpen(p);
 const key=previewKey(p);
 if(!key){const nat=p.demo?'Ini data demo. Tambahkan file video milikmu lewat Import Preset.':p.kind==='link'?'Entri tautan tidak memiliki file preview.':`Preset ${(p.ext||'').toUpperCase()||'ini'} tidak memiliki file preview yang dapat diputar browser. Tambahkan file preview lewat tombol Edit pada halaman detail.`;placeholderOverlay(p,nat);return}
 let blob=null;try{blob=await DB.get(key)}catch(e){}
 if(S.player.token!==tok)return;
 if(!blob){setOverlay('er',`<div class="box">${ic('alert',34)}<b>File preview tidak ditemukan</b><span class="sm">Data browser mungkin sudah dihapus. Cek di File Manager.</span></div>`);toast('File preview tidak ditemukan di penyimpanan browser.','error');return}
 const ext=key.endsWith(':prev')?p.prevExt:p.ext,grp=groupOf(ext),url=await blobURL(key);if(S.player.token!==tok)return;
 if(grp==='image'){media.innerHTML=`<img class="pv" alt="Preview ${esc(p.name)}">`;const im=media.firstChild;im.onload=()=>{setOverlay('');$('#stage').classList.remove('paused')};im.onerror=()=>setOverlay('er',`<div class="box">${ic('alert',34)}<b>Gambar tidak dapat ditampilkan</b></div>`);im.src=url;$('#ctrl').querySelectorAll('button:not([data-act=pl-prev]):not([data-act=pl-next]),input,select').forEach(e=>{if(!['pl-fs'].includes(e.dataset.act))e.disabled=true});return}
 const v=document.createElement('video');v.playsInline=true;v.preload='metadata';v.volume=S.settings.volume;v.playbackRate=S.settings.speed;v.loop=S.player.loop;v.setAttribute('aria-label','Preview '+p.name);
 media.appendChild(v);S.player.v=v;const seek=$('#seek'),stage=$('#stage');let loaded=false;
 const upd=()=>{if(!v.isConnected)return;const d=v.duration;$('#t-cur').textContent=fmtTime(v.currentTime);if(isFinite(d)&&document.activeElement!==seek)seek.value=d?Math.round(v.currentTime/d*1000):0};
 v.addEventListener('loadedmetadata',()=>{loaded=true;seek.disabled=false;$('#pl-play').disabled=false;$('#t-dur').textContent=fmtTime(v.duration);let ch=false;
  if(p.duration==null&&isFinite(v.duration)){p.duration=v.duration;ch=true;$('#i-dur').textContent=fmtTime(v.duration)}
  if(!p.resolution&&v.videoWidth>0){p.resolution=v.videoWidth+'x'+v.videoHeight;ch=true;$('#i-res').textContent=v.videoWidth+' × '+v.videoHeight}
  if(ch)savePresets();if(grp==='audio'){setOverlay('ph','<div class="box"><span class="ph-badge">Audio preview</span></div>');$('#stage-ov').style.pointerEvents='none'}});
 v.addEventListener('canplay',()=>{if(grp!=='audio')setOverlay('')});
 v.addEventListener('waiting',()=>{if(loaded&&grp!=='audio')setOverlay('ld','<div class="box"><span class="spin"></span></div>')});
 v.addEventListener('playing',()=>{if(grp!=='audio')setOverlay('')});
 v.addEventListener('play',()=>{stage.classList.remove('paused');$('#pl-play').innerHTML=ic('pause',22);if(!S.player.logged){S.player.logged=true;trackPlay(p)}});
 v.addEventListener('pause',()=>{stage.classList.add('paused');$('#pl-play').innerHTML=ic('play',22)});
 v.addEventListener('timeupdate',upd);
 v.addEventListener('volumechange',()=>{$('#pl-mute').innerHTML=ic(v.muted||v.volume===0?'mute':'volume',18)});
 v.addEventListener('ended',()=>{stage.classList.add('paused');if(!v.loop&&S.queue.includes(p.id)){const l=S.queue,i=l.indexOf(p.id);if(i<l.length-1||S.settings.repeatQueue){stepPreset(1);return}}$('#pl-play').innerHTML=ic('play',22)});
 v.addEventListener('error',()=>{const c=v.error&&v.error.code;const m={1:'Pemutaran dibatalkan.',2:'Terjadi masalah saat membaca file.',3:'File rusak atau codec-nya tidak didukung browser ini.',4:'Format ini tidak dapat diputar oleh browser kamu (mis. MOV/HEVC).'}[c]||'Video tidak dapat diputar.';setOverlay('er',`<div class="box">${ic('alert',34)}<b>Video tidak dapat diputar</b><span class="sm">${esc(m)}</span><button class="btn sm" data-act="pl-retry">Coba lagi</button></div>`);toast('Video tidak dapat diputar. '+m,'error')});
 const fsh=()=>{if(S.player.v===v)v.controls=!!(document.fullscreenElement||document.webkitFullscreenElement)};document.addEventListener('fullscreenchange',fsh);S.player.fsh=fsh;
 stage.addEventListener('click',e=>{if(e.target===v)togglePlay()});
 v.src=url;$('#pl-loop').classList.toggle('on',v.loop);
 if(S.settings.autoplay)v.play().catch(()=>toast('Pemutaran otomatis diblokir browser. Tekan tombol putar.','info'))}
AFTER.player=r=>{const p=byId(r.id||S.activeId);if(p)mountPlayer(p)};
function stopPlayer(){const v=S.player.v;if(S.player.fsh)document.removeEventListener('fullscreenchange',S.player.fsh);if(v){try{v.pause();v.removeAttribute('src');v.load()}catch{}}S.player={id:null,v:null,logged:false,loop:S.player.loop,token:null};if(document.fullscreenElement)try{document.exitFullscreen()}catch{}}
function togglePlay(){const v=S.player.v;if(!v||$('#pl-play')?.disabled)return;if(v.paused)v.play().catch(e=>toast('Tidak dapat memutar: '+(e&&e.message||e),'error'));else v.pause()}
function seekBy(s){const v=S.player.v;if(!v||!isFinite(v.duration))return;v.currentTime=Math.min(v.duration,Math.max(0,v.currentTime+s))}
function toggleFS(){const st=$('#stage');if(!st)return;const cur=document.fullscreenElement||document.webkitFullscreenElement;if(cur){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{const f=st.requestFullscreen||st.webkitRequestFullscreen;if(!f){toast('Layar penuh tidak didukung browser ini.','warn');return}Promise.resolve(f.call(st)).catch(()=>toast('Tidak dapat masuk layar penuh.','error'))}}
function openPlayer(id){S.activeId=id;go('player/'+id)}
function stepPreset(dir){const list=orderList();if(!list.length){toast('Tidak ada preset untuk dipilih.','info');return}
 let i=list.findIndex(x=>x.id===S.player.id||x.id===S.activeId);
 if(i<0)i=dir>0?0:list.length-1;else{i+=dir;if(i>=list.length||i<0){if(S.queue.length&&!S.settings.repeatQueue){toast(dir>0?'Sudah di akhir antrean.':'Sudah di awal antrean.','info');return}i=(i+list.length)%list.length}}
 const t=list[i];if(!previewKey(t))toast(`Preview "${t.name}" belum tersedia.`,'warn');openPlayer(t.id)}

/* ----- Import ----- */
VIEWS.import=()=>`<section class="page"><div class="page-h"><div><h1>Import Preset</h1><p class="muted">Tambahkan file dari perangkatmu. File disimpan di browser (IndexedDB), tidak dikirim ke server mana pun.</p></div></div>
 <div class="drop" id="dropzone" data-act="imp-pick" tabindex="0" role="button" aria-label="Pilih file"><div class="ei" style="width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:color-mix(in srgb,var(--a) 18%,transparent);color:var(--b)">${ic('upload',30)}</div><h2>Pilih atau seret file ke sini</h2><p class="muted sm">MP4, WebM, MOV*, PNG, JPG, GIF, XML, ZIP, proyek Alight Motion, dan lampiran lain. Maks. 300 MB per file.<br>*MOV hanya bisa dipratinjau jika browser mendukungnya.</p><button class="btn primary" type="button">${ic('plus',16)}Pilih file</button></div>
 <div class="notice warn">${ic('alert',18)}<div>File berformat native Alight Motion (XML/ZIP/proyek) tidak dirender browser. Tambahkan <b>file preview</b> (video/gambar) agar bisa diputar. File berbahaya (.exe, .apk, .html, .js, dll.) ditolak, dan isi file tidak pernah dijalankan.</div></div>
 <div class="notice">${ic('info',18)}<div>Punya link preset atau kode XML? Gunakan <a href="#/paste">Tempel Preset</a> — tanpa perlu membuat file.</div></div>
 <div id="stg-wrap">${stagedHTML()}</div></section>`;
function stagedHTML(){const L=S.staged;if(!L.length)return '';const ok=L.filter(s=>!s.errors.length).length;
 return `<div class="sec-h"><h2>Siap disimpan (${ok}/${L.length})</h2><div class="row-actions"><button class="btn ghost" data-act="imp-clear" ${S.busy?'disabled':''}>Batalkan semua</button><button class="btn primary" data-act="imp-save" ${S.busy||!ok?'disabled':''}>${ic('check',16)}Simpan ${ok} preset</button></div></div>
 <div id="imp-prog" style="display:${S.busy?'block':'none'}"><div class="prog"><i id="imp-bar"></i></div><p class="muted sm" id="imp-msg" style="margin-top:6px"></p></div>
 <div class="plist">${L.map(s=>`<div class="card stg" data-sid="${s.sid}"><div><div class="thumb">${s.thumbUrl?`<div class="vis has-img" style="--h:${catHue(s.cat)}"><img alt="" src="${s.thumbUrl}"></div>`:`<div class="vis" style="--h:${catHue(s.cat)}"><span class="vis-ic">${ic(s.ext&&IMG_EXT.includes(s.ext)?'film':'file',34)}</span></div>`}<span class="badge">${esc((s.ext||'file').toUpperCase())}</span></div><p class="muted xs" style="margin-top:6px;word-break:break-all">${esc(s.file.name)}<br>${fmtSize(s.file.size)}${s.duration!=null?' · '+fmtTime(s.duration):''}${s.resolution?' · '+s.resolution.replace('x','×'):''}</p></div>
 <div class="form">${s.errors.map(e=>`<div class="notice bad">${ic('alert',16)}<div>${esc(e)}</div></div>`).join('')}${s.warns.map(e=>`<div class="notice warn">${ic('info',16)}<div>${esc(e)}</div></div>`).join('')}
 ${s.errors.length?'':`<div class="stg-f"><label class="fld wide"><span>Nama preset *</span><input class="input" data-in="stg" data-sid="${s.sid}" data-f="name" maxlength="80" value="${esc(s.name)}"></label>
 <label class="fld"><span>Kategori</span><select class="input" data-in="stg" data-sid="${s.sid}" data-f="cat">${CATS.map(c=>`<option ${s.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
 <label class="fld"><span>Pembuat (opsional)</span><input class="input" data-in="stg" data-sid="${s.sid}" data-f="creator" maxlength="60" value="${esc(s.creator)}"></label>
 <label class="fld wide"><span>Deskripsi</span><textarea class="input" data-in="stg" data-sid="${s.sid}" data-f="desc" maxlength="600">${esc(s.desc)}</textarea></label>
 <label class="fld wide"><span>Tag (pisahkan koma)</span><input class="input" data-in="stg" data-sid="${s.sid}" data-f="tags" value="${esc(s.tags)}"></label></div>
 <div class="row-actions"><button class="btn sm" data-act="imp-prevpick" data-sid="${s.sid}">${ic('film',14)}${s.prev?'Ganti':'Tambah'} file preview</button>${s.prev?`<span class="sm muted">${esc(s.prev.name)} (${fmtSize(s.prev.size)})</span><button class="icon-btn sm" data-act="imp-prevclear" data-sid="${s.sid}" aria-label="Hapus preview">${ic('x',14)}</button>`:''}</div>`}
 <div><button class="btn danger sm" data-act="imp-remove" data-sid="${s.sid}">${ic('trash',14)}Hapus dari daftar</button></div></div></div>`).join('')}</div>`}
const rerenderStaged=()=>{const w=$('#stg-wrap');if(w)w.innerHTML=stagedHTML()};
function guessCat(name,ext){const n=name.toLowerCase();if(ext==='xml')return 'XML Preset';const hit=CATS.find(c=>c!=='Custom Preset'&&c!=='XML Preset'&&n.includes(c.toLowerCase()));if(hit)return hit;if(/qr/.test(n)&&IMG_EXT.includes(ext))return 'QR Code Preset';return 'Custom Preset'}
function drawThumb(src,w,h){return new Promise(res=>{try{const sc=Math.min(1,480/w),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));c.getContext('2d').drawImage(src,0,0,c.width,c.height);c.toBlob(b=>res(b),'image/jpeg',.8)}catch(e){res(null)}})}
function mediaMeta(file,kind){return new Promise(res=>{if(!['image','video','audio'].includes(kind))return res(null);const url=URL.createObjectURL(file);let done=false;const fin=r=>{if(done)return;done=true;URL.revokeObjectURL(url);res(r)};setTimeout(()=>fin(null),9000);
 if(kind==='image'){const im=new Image();im.onload=async()=>fin({w:im.naturalWidth,h:im.naturalHeight,thumb:await drawThumb(im,im.naturalWidth,im.naturalHeight)});im.onerror=()=>fin(null);im.src=url}
 else{const v=document.createElement(kind==='video'?'video':'audio');v.preload='metadata';v.muted=true;v.playsInline=true;
  v.onloadedmetadata=()=>{if(kind==='audio')return fin({duration:v.duration});try{v.currentTime=isFinite(v.duration)?Math.min(1,v.duration/2):0}catch{}};
  v.onseeked=async()=>{const w=v.videoWidth,h=v.videoHeight;fin({duration:isFinite(v.duration)?v.duration:null,w,h,thumb:w?await drawThumb(v,w,h):null})};v.onerror=()=>fin(null);v.src=url}})}
async function addStaged(files){
 let added=[];
 for(const f of files){if(S.staged.length>=MAX_STAGE){toast(`Maksimal ${MAX_STAGE} file sekali impor.`,'warn');break}
  const ext=extOf(f.name),st={sid:uid(),file:f,ext,name:(f.name.replace(/\.[^.]+$/,'')||'Preset baru').slice(0,80),cat:guessCat(f.name,ext),desc:'',tags:'',creator:'',prev:null,thumb:null,thumbUrl:null,duration:null,resolution:null,errors:[],warns:[]};
  if(BLOCK_EXT.includes(ext))st.errors.push(`Format .${ext} ditolak demi keamanan.`);
  else if(!f.size)st.errors.push('File kosong (0 byte).');
  else if(f.size>MAX_FILE)st.errors.push(`Ukuran ${fmtSize(f.size)} melebihi batas ${fmtSize(MAX_FILE)}.`);
  if(!st.errors.length){if(!ext)st.warns.push('File tanpa ekstensi akan disimpan sebagai lampiran.');
   if(f.size>WARN_FILE)st.warns.push('File besar: penyimpanan browser bisa penuh.');
   const g=groupOf(ext);if(ext==='mov'){const v=document.createElement('video');if(!v.canPlayType('video/quicktime'))st.warns.push('Browser ini mungkin tidak dapat memutar MOV. Tambahkan preview MP4/WebM.')}
   if(['xml','zip','project','other'].includes(g))st.warns.push('Tidak dapat dipratinjau di browser. Tambahkan file preview terpisah agar bisa diputar.')}
  S.staged.push(st);added.push(st)}
 rerenderStaged();
 for(const st of added){if(st.errors.length)continue;const g=groupOf(st.ext);const m=await mediaMeta(st.file,g);if(!S.staged.includes(st))continue;
  if(m){st.duration=m.duration??null;st.resolution=m.w?m.w+'x'+m.h:null;st.thumb=m.thumb||null;if(st.thumb)st.thumbUrl=URL.createObjectURL(st.thumb)}
  else if(['image','video'].includes(g))st.warns.push('Thumbnail tidak dapat dibuat — format/codec mungkin tidak didukung browser.');
  rerenderStaged()}}
const stById=sid=>S.staged.find(s=>s.sid===sid);
function freeStaged(s){if(s.thumbUrl)URL.revokeObjectURL(s.thumbUrl)}
async function saveStaged(){
 const list=S.staged.filter(s=>!s.errors.length);if(!list.length){toast('Tidak ada file valid untuk disimpan.','warn');return}
 if(list.some(s=>!s.name.trim())){toast('Nama preset tidak boleh kosong.','error');return}
 S.busy=true;rerenderStaged();const bar=()=>$('#imp-bar'),msg=()=>$('#imp-msg');let ok=0,fail=0,quota=false;
 for(let i=0;i<list.length;i++){const s=list[i];if(msg())msg().textContent=`Menyimpan ${i+1} dari ${list.length}: ${s.file.name}`;if(bar())bar().style.width=Math.round(i/list.length*100)+'%';
  const id=uid(),keys=[];
  try{await DB.put(id+':main',withType(s.file,s.ext));keys.push(id+':main');
   let hasPrev=false,prevExt='',thumb=s.thumb,dur=s.duration,res=s.resolution;
   if(s.prev){const pe=extOf(s.prev.name);await DB.put(id+':prev',withType(s.prev,pe));keys.push(id+':prev');hasPrev=true;prevExt=pe;
    const m=await mediaMeta(s.prev,groupOf(pe));if(m){if(!thumb&&m.thumb)thumb=m.thumb;if(dur==null&&m.duration!=null)dur=m.duration;if(!res&&m.w)res=m.w+'x'+m.h}}
   if(thumb){await DB.put(id+':thumb',thumb);keys.push(id+':thumb')}
   const p=sanitizePreset({id,name:s.name.trim(),creator:s.creator.trim()||null,category:s.cat,description:s.desc,tags:parseTags(s.tags),ext:s.ext,prevExt,fileName:s.file.name,size:s.file.size,resolution:res,duration:dur,added:Date.now(),kind:'file',hasMain:true,hasPrev,hasThumb:!!thumb});
   S.presets.unshift(p);ok++;S.staged=S.staged.filter(x=>x!==s);freeStaged(s)
  }catch(e){fail++;console.error(e);for(const k of keys)await DB.del(k).catch(()=>{});if(isQuota(e)){quota=true;break}}}
 S.busy=false;savePresets();if(bar())bar().style.width='100%';
 if(ok)toast(`${ok} preset berhasil ditambahkan.`,'success');
 if(quota)toast('Penyimpanan penuh. Hapus beberapa file lalu coba lagi.','error');else if(fail)toast(`${fail} file gagal disimpan.`,'error');
 if(!S.staged.length&&ok){go('library')}else{rerenderStaged();updateNav()}}
AFTER.import=()=>{const dz=$('#dropzone');if(!dz)return;
 ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('over')}));
 ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('over')}));
 dz.addEventListener('drop',e=>{const f=[...(e.dataTransfer&&e.dataTransfer.files||[])];if(f.length)addStaged(f);else toast('Tidak ada file yang dijatuhkan.','warn')});
 dz.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#f-import').click()}})};

/* ----- Edit metadata ----- */
function editPreset(p){
 const m=openModal({title:'Edit metadata',wide:true,body:`<form class="form" id="ef" onsubmit="return false"><label class="fld"><span>Nama preset *</span><input class="input" name="name" maxlength="80" value="${esc(p.name)}"></label>
 <div class="stg-f"><label class="fld"><span>Pembuat (opsional)</span><input class="input" name="creator" maxlength="60" value="${esc(p.creator||'')}"></label><label class="fld"><span>Kategori</span><select class="input" name="cat">${CATS.map(c=>`<option ${p.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label></div>
 <label class="fld"><span>Deskripsi</span><textarea class="input" name="desc" maxlength="600">${esc(p.description)}</textarea></label>
 <label class="fld"><span>Tag (pisahkan koma)</span><input class="input" name="tags" value="${esc(p.tags.join(', '))}"></label>
 <label class="fld"><span>Tautan sumber (opsional, http/https)</span><input class="input" name="src" inputmode="url" value="${esc(p.sourceUrl)}"></label>
 ${p.demo?'':`<label class="fld"><span>${p.hasPrev?'Ganti':'Tambah'} file preview (video, gambar, atau audio)</span><input class="input" type="file" name="prev" accept="video/*,image/*,audio/*,.mp4,.webm,.mov,.png,.jpg,.jpeg,.gif,.webp,.mp3,.wav,.ogg,.m4a"></label>`}
 <p class="err" id="e-err" role="alert"></p></form>`,
 actions:[{label:'Batal'},{label:'Simpan',cls:'primary',run:async w=>{const f=$('#ef',w),q=n=>f.elements[n],err=t=>{$('#e-err',w).textContent=t;return false};
  const name=q('name').value.trim();if(!name)return err('Nama preset wajib diisi.');
  let src=q('src').value.trim();if(src){if(src.length>2000)return err('Tautan sumber terlalu panjang (maks. 2000 karakter).');if(!safeUrl(src))return err('Tautan sumber harus diawali http:// atau https://')}
  const pf=q('prev')&&q('prev').files[0];let pe='';
  if(pf){pe=extOf(pf.name);if(!['video','image','audio'].includes(groupOf(pe)))return err('File preview harus berupa video, gambar, atau audio yang didukung.');if(pf.size>MAX_FILE)return err('File preview terlalu besar (maks. 300 MB).')}
  if(pf){try{await DB.put(p.id+':prev',withType(pf,pe));dropURL(p.id+':prev');p.hasPrev=true;p.prevExt=pe;const mt=await mediaMeta(pf,groupOf(pe));
    if(mt){if(mt.thumb&&!p.hasThumb){await DB.put(p.id+':thumb',mt.thumb);dropURL(p.id+':thumb');p.hasThumb=true}if(p.duration==null&&mt.duration!=null)p.duration=mt.duration;if(!p.resolution&&mt.w)p.resolution=mt.w+'x'+mt.h}}catch(e){return err(isQuota(e)?'Penyimpanan penuh.':'Gagal menyimpan preview: '+(e&&e.message||e))}}
  p.name=name;p.creator=q('creator').value.trim().slice(0,60)||null;p.category=q('cat').value;p.description=q('desc').value.slice(0,600);p.tags=parseTags(q('tags').value);p.sourceUrl=src||'';
  if(savePresets()){toast('Metadata berhasil disimpan.','success')}refresh();updateNav()}}]})}
async function deletePreset(p){
 if(!await confirmBox('Hapus preset?',`"${p.name}" akan dihapus dari library beserta file yang tersimpan di browser. Tindakan ini tidak dapat dibatalkan.`,'Hapus',true))return;
 for(const k of['main','prev','thumb']){dropURL(p.id+':'+k);await DB.del(p.id+':'+k).catch(()=>{})}
 S.presets=S.presets.filter(x=>x.id!==p.id);S.queue=S.queue.filter(i=>i!==p.id);S.opened=S.opened.filter(o=>o.id!==p.id);S.played=S.played.filter(o=>o.id!==p.id);if(S.activeId===p.id)S.activeId=null;
 savePresets();saveLists();toast(`"${p.name}" berhasil dihapus.`,'success');
 if(['detail','player'].includes(S.route.name)&&(S.route.id===p.id||S.player.id===p.id))go('library');else{render();updateNav()}}
async function downloadPreset(p){
 const key=p.id+':main';
 if(p.hasMain){toast('Menyiapkan file…','info');let b=null;try{b=await DB.get(key)}catch{}
  if(!b){toast('File tidak ditemukan di penyimpanan browser (mungkin sudah dihapus).','error');return}
  const name=safeName(p.fileName||(p.name+(p.ext?'.'+p.ext:'')));const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),8000);
  toast(`Unduhan "${name}" dimulai (${fmtSize(b.size)}).`,'success');return}
 const src=safeUrl(p.sourceUrl);
 if(src){await openLinkSafe(p.sourceUrl);return}
 toast('Tidak ada file atau tautan yang dapat diunduh.','warn')}

/* ----- QR ----- */
const SHORT=['bit.ly','tinyurl.com','t.co','goo.gl','is.gd','cutt.ly','rb.gy','s.id','shorturl.at','ow.ly'];
function assessUrl(t){let u;try{u=new URL(String(t).trim())}catch{return{kind:'text',warnings:[]}}
 if(!['http:','https:'].includes(u.protocol))return{kind:'blocked',warnings:[`Skema "${u.protocol}" tidak dibuka dari aplikasi ini.`]};
 const w=[];if(u.protocol==='http:')w.push('Tautan tidak terenkripsi (http).');if(/^\d{1,3}(\.\d{1,3}){3}$/.test(u.hostname)||u.hostname.includes(':'))w.push('Alamat berupa IP, bukan nama domain.');
 if(u.hostname.includes('xn--'))w.push('Domain memakai punycode (bisa menyerupai domain lain).');if(u.username||u.password)w.push('URL memuat kredensial — sering dipakai untuk menyesatkan.');
 if(SHORT.includes(u.hostname))w.push('Tautan pendek: tujuan akhir tidak terlihat.');if(u.hostname.split('.').length>4)w.push('Subdomain sangat banyak.');if(u.href.length>300)w.push('URL sangat panjang.');
 return{kind:'url',url:u.href,host:u.hostname,warnings:w}}
function qrResultHTML(){const r=S.qr.result;if(r==null)return '';const a=assessUrl(r);
 return `<div class="card pad" style="display:flex;flex-direction:column;gap:12px"><h2>Hasil pemindaian</h2><div class="input" style="word-break:break-all;min-height:0">${esc(r)}</div>
 ${a.warnings.length?`<div class="notice ${a.kind==='blocked'?'bad':'warn'}">${ic('alert',18)}<div><b>Peringatan</b><ul>${a.warnings.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>`:''}
 ${a.kind==='text'?`<p class="muted sm">Isi QR bukan tautan web. Aplikasi hanya dapat menyalinnya.</p>`:''}
 <div class="row-actions"><button class="btn" data-act="qr-copy">${ic('copy',16)}Salin</button>${a.kind==='url'?`<button class="btn primary" data-act="qr-open">${ic('external',16)}Buka tautan</button>`:''}<button class="btn" data-act="qr-save">${ic('plus',16)}Simpan ke library</button><button class="btn ghost" data-act="qr-clear">Hapus hasil</button></div>
 <p class="muted xs">Keberhasilan impor ke Alight Motion bergantung pada jenis QR/tautan, versi aplikasi, dan dukungan yang tersedia — tidak ada jaminan semua QR bisa langsung diimpor.</p></div>`}
VIEWS.qr=()=>`<section class="page"><div class="page-h"><div><h1>QR Scanner</h1><p class="muted">Pindai kode QR preset lewat kamera atau pilih gambar QR dari galeri.</p></div></div>
 <div class="two"><div class="card pad" style="display:flex;flex-direction:column;gap:12px"><h2>Kamera</h2><div class="qr-box" id="qr-box"><div class="muted sm" style="padding:20px;text-align:center">Kamera belum aktif</div></div>
  <div class="row-actions"><button class="btn primary" data-act="qr-start" id="qr-start">${ic('camera',16)}Mulai pindai</button><button class="btn" data-act="qr-stop" id="qr-stop" style="display:none">Berhenti</button></div>
  <p class="muted xs">Kamera memerlukan izin dan koneksi aman (HTTPS atau localhost). Tanpa dukungan bawaan browser, pemindai memuat library jsQR dari internet.</p></div>
 <div class="card pad" style="display:flex;flex-direction:column;gap:12px"><h2>Dari gambar</h2><div class="qr-box" id="qr-img">${S.qr.imgUrl?`<img alt="QR code yang dipilih" src="${S.qr.imgUrl}">`:`<div class="muted sm" style="padding:20px;text-align:center">Belum ada gambar</div>`}</div>
  <div class="row-actions"><button class="btn primary" data-act="qr-pick">${ic('upload',16)}Pilih gambar QR</button></div>
  <label class="fld"><span>Atau periksa tautan secara manual</span><div style="display:flex;gap:8px"><input class="input" id="qr-manual" placeholder="https://…" inputmode="url"><button class="btn" data-act="qr-check">Periksa</button></div></label></div></div>
 ${S.qr.err?`<div class="notice bad">${ic('alert',18)}<div>${esc(S.qr.err)}</div></div>`:''}<div id="qr-res">${qrResultHTML()}</div></section>`;
let jsqrP=null;function loadJsQR(){if(window.jsQR)return Promise.resolve(window.jsQR);if(jsqrP)return jsqrP;jsqrP=new Promise(res=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js';s.onload=()=>res(window.jsQR||null);s.onerror=()=>{jsqrP=null;res(null)};document.head.appendChild(s)});return jsqrP}
async function decodeQR(canvas){if('BarcodeDetector' in window){try{const d=new BarcodeDetector({formats:['qr_code']});const r=await d.detect(canvas);return r&&r[0]?r[0].rawValue:null}catch(e){}}
 const j=await loadJsQR();if(!j)throw new Error('lib');const c=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height);const r=j(c.data,c.width,c.height);return r?r.data:null}
const setQR=t=>{S.qr.result=t;S.qr.err='';const el=$('#qr-res');if(el)el.innerHTML=qrResultHTML()};
async function startScan(){
 if(S.qr.scanning)return;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('Browser ini tidak mendukung akses kamera.','error');return}
 if(!window.isSecureContext){toast('Kamera hanya bisa dipakai lewat HTTPS atau localhost.','error');return}
 if(!('BarcodeDetector' in window)&&!await loadJsQR()){toast('Library pemindai gagal dimuat (perlu internet). Coba pilih gambar QR dari galeri.','error');return}
 if(!await confirmBox('Izinkan akses kamera?','Aplikasi akan meminta izin kamera untuk memindai QR. Video tidak direkam maupun dikirim ke mana pun.','Lanjutkan'))return;
 let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}catch(e){const m={NotAllowedError:'Izin kamera ditolak. Aktifkan izin kamera di pengaturan browser.',NotFoundError:'Kamera tidak ditemukan di perangkat ini.',NotReadableError:'Kamera sedang dipakai aplikasi lain.'}[e.name]||'Kamera tidak dapat dibuka: '+(e.message||e.name);S.qr.err=m;toast(m,'error');const v=$('#view');if(S.route.name==='qr')render();return}
 if(S.route.name!=='qr'){stream.getTracks().forEach(t=>t.stop());return}

function parseXmlSafe(text){

  const lc=/line (\d+) at column (\d+)/i.exec(m)||/Line Number (\d+), Column (\d+)/i.exec(m);
  return{ok:false,err:m||'Sintaks XML tidak valid.',line:lc?+lc[1]:null,col:lc?+lc[2]:null}}
 if(!doc.documentElement)return{ok:false,err:'Dokumen XML tidak memiliki elemen root.'};
 return{ok:true,doc}}

 const q=[root];for(let i=0;i<q.length&&i<500;i++){const n=q[i];const ln=(n.localName||'').toLowerCase();
  if(n!==root&&META_KEYS.includes(ln)&&!n.children.length){const t=(n.textContent||'').trim();if(t&&t.length<=120&&!(ln in meta))meta[ln]=t}
  if(q.length<2000)for(const c of n.children)q.push(c)}
 return meta}
function xmlSummary(doc){

function validateXml(quiet){
 const X=PASTE.xml;if(!X.text.trim()){if(!quiet)toast('Tempel XML terlebih dahulu.','warn');return null}
 const r=parseXmlSafe(X.text);
 if(!r.ok){X.vstate='invalid';X.err=r.err;X.line=r.line||null;X.col=r.col||null;X.info=null;renderXmlSide();if(!quiet)toast('XML tidak valid'+(r.line?` (baris ${r.line}, kolom ${r.col})`:'')+'. Lihat panel hasil.','error');return null}
 X.vstate='valid';X.err='';X.line=X.col=null;X.info=xmlSummary(r.doc);renderXmlSide();
